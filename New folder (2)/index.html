const STORAGE_KEY = 'asas-ratib-combined-v1';
let state = { doc: null, method: null, stepIndex: 0, counts: [] };
let advancing = false;

async function loadState(){
  try{
    let raw = null;
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(STORAGE_KEY, false);
      raw = res && res.value;
    } else if(window.localStorage){
      raw = localStorage.getItem(STORAGE_KEY);
    }
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){ state = parsed; }
    }
  }catch(e){}
  repairStaleState();
  render();
}
function repairStaleState(){
  // Guards against stale saved progress from an older version of the step data
  // (e.g. a doc's step count changed since the person last used the app),
  // which otherwise leaves `counts` shorter than `currentSteps()` and breaks the counter UI.
  try{
    const steps = currentSteps();
    if(!steps.length) return;
    if(!Array.isArray(state.counts) || state.counts.length !== steps.length){
      state.stepIndex = 0;
      state.counts = new Array(steps.length).fill(0);
      advancing = false;
    }
  }catch(e){}
}
async function saveState(){
  try{
    const json = JSON.stringify(state);
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(STORAGE_KEY, json, false);
    } else if(window.localStorage){
      localStorage.setItem(STORAGE_KEY, json);
    }
  }catch(e){}
}

const DOC_STEPS = {
  ratib: RATIB_STEPS, sahar: SAHAR_STEPS, juma: JUMA_MONDAY_STEPS, postasr: POST_ASR_STEPS,
  yasin: YASIN_DUA_STEPS, nabawiyya: NABAWIYYA_STEPS, idtijaa: IDTIJAA_STEPS, duha: DUHA_STEPS,
  postdhuhr: POST_DHUHR_STEPS, postmaghrib: POST_MAGHRIB_STEPS, latenight: LATE_NIGHT_STEPS, munajah: MUNAJAH_STEPS,
};

function currentSteps(){
  if(state.doc === 'asas') return getSteps(state.method);
  if(DOC_STEPS[state.doc]) return DOC_STEPS[state.doc];
  return [];
}

function selectDoc(doc){
  if(DOC_STEPS[doc]){
    state = { doc, method:null, stepIndex:0, counts:new Array(DOC_STEPS[doc].length).fill(0) };
    advancing = false;
    saveState(); render();
  } else {
    state = { doc:'asas', method:null, stepIndex:0, counts:[] };
    advancing = false;
    saveState(); render();
  }
}
function selectMethod(method){
  state = { doc:'asas', method, stepIndex:0, counts:new Array(getSteps(method).length).fill(0) };
  advancing = false;
  saveState(); render();
}
function backToDocMenu(){
  state = { doc:null, method:null, stepIndex:0, counts:[] };
  advancing = false;
  saveState(); render();
}
function backToAsasMenu(){
  state = { doc:'asas', method:null, stepIndex:0, counts:[] };
  advancing = false;
  saveState(); render();
}
function openFadhl(){
  state = { doc:'fadhl', method:null, stepIndex:0, counts:[] };
  advancing = false;
  saveState(); render();
}
function openPoems(){
  state = { doc:'poems', method:null, stepIndex:0, counts:[] };
  advancing = false;
  saveState(); render();
}
function openPoem(id){
  const poem = POEMS.find(p => p.id === id);
  if(!poem || !poem.ready) return;
  state = { doc:'poem', poemId:id, verseIndex:0 };
  advancing = false;
  saveState(); render();
}
function poemNext(){
  const poem = POEMS.find(p => p.id === state.poemId);
  const verses = poemVerses(poem);
  state.verseIndex = Math.min(state.verseIndex + 1, verses.length);
  saveState(); render();
}
function poemPrev(){
  if(state.verseIndex > 0){ state.verseIndex--; saveState(); render(); }
  else { openPoems(); }
}

/* ============================================================
   أدوات العرض المشتركة (الحلقة، الاهتزاز، إلخ)
   ============================================================ */
function buildRing(target, count, size){
  size = size || 230;
  const cx = size/2, cy = size/2, r = size*0.4348, beadR = size*0.027;
  const n = Math.min(target, 33);
  let beads = '';
  const filled = Math.min(count, n);
  for(let i=0;i<n;i++){
    const angle = (i / n) * 2*Math.PI;
    const x = cx + r*Math.cos(angle);
    const y = cy + r*Math.sin(angle);
    const isFilled = i < filled;
    beads += `<circle class="bead" cx="${x}" cy="${y}" r="${isFilled? beadR+1 : beadR}" fill="${isFilled? 'url(#goldGrad)':'rgba(232,198,126,0.18)'}"/>`;
  }
  return `<svg class="ring" viewBox="0 0 ${size} ${size}">
    <defs><radialGradient id="goldGrad" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#f6dda0"/><stop offset="100%" stop-color="#c9a25c"/></radialGradient></defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(232,198,126,0.10)" stroke-width="1"/>
    ${beads}
  </svg>`;
}
function lapInfo(target, count){
  if(target <= 33) return null;
  const beadsPerLap = 33;
  const totalLaps = Math.ceil(target / beadsPerLap);
  const currentLap = count === 0 ? 1 : Math.min(totalLaps, Math.floor((count-1)/beadsPerLap)+1);
  return { currentLap, totalLaps };
}
function ringCount(target, count){
  if(target <= 33) return count;
  return count === 0 ? 0 : ((count-1) % 33) + 1;
}

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  return audioCtx;
}
function beep(times){
  const ctx = getAudioCtx();
  if(!ctx) return;
  if(ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }
  let t = ctx.currentTime;
  for(let k=0;k<times;k++){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t+0.17);
    t += 0.24;
  }
}
function notifyUser(times){
  let vibrated = false;
  if('vibrate' in navigator){
    try{ vibrated = navigator.vibrate(times === 1 ? 180 : [150,120,150]); }catch(e){}
  }
  if(!vibrated){ beep(times); }
}

function vibrateAt(count, step){
  if(state.doc === 'asas'){
    if(!step || !step.halfSplit) return;
    const half = Math.ceil(step.target / 2);
    if(count === half){ notifyUser(1); }
    else if(count === step.target){ notifyUser(2); }
  } else if(['ratib','sahar','juma','postasr','yasin','nabawiyya','idtijaa','duha','postdhuhr','postmaghrib','latenight','munajah'].includes(state.doc)){
    if(step.target <= 3) return;
    if(count === step.target){ notifyUser(1); }
  }
}

/* ============================================================
   التفاعل: عدّ، تراجع، تخطي، تالٍ، إعادة
   ============================================================ */
function tap(){
  if(advancing || !state.doc) return;
  const steps = currentSteps();
  const i = state.stepIndex, step = steps[i];
  if(!step) return;
  if(state.counts[i] < step.target){
    state.counts[i]++;
    vibrateAt(state.counts[i], step);
    saveState();
    render();
    if(state.counts[i] >= step.target){
      advancing = true;
      setTimeout(()=>{ advancing = false; goNext(); }, 500);
    }
  } else {
    // الذكر مكتمل بالفعل (مثلاً بعد الرجوع للسابق) — لمس العدّاد ينتقل للذكر التالي مباشرة
    goNext();
  }
}
function undo(){
  if(advancing) return;
  const i = state.stepIndex;
  if(state.counts[i] > 0){ state.counts[i]--; saveState(); render(); }
}
function skipStep(){
  if(advancing) return;
  goNext();
}
function goNext(){
  const steps = currentSteps();
  if(state.stepIndex < steps.length - 1){ state.stepIndex++; }
  else { state.stepIndex = steps.length; }
  saveState(); render();
}
function goPrev(){
  if(advancing) return;
  if(state.stepIndex > 0){ state.stepIndex--; saveState(); render(); }
}
function restart(){
  const steps = currentSteps();
  state = { doc: state.doc, method: state.method, stepIndex:0, counts:new Array(steps.length).fill(0) };
  advancing = false;
  saveState(); render();
}

        </div>
        <div class="icon-btn" onclick="restart()" title="إعادة العدّ" role="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6M5 15a7 7 0 0011.5 3M19 9A7 7 0 007.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>
    ${badge}

    <div class="stage">
      <div class="dhikr-card">
        ${step.note ? `<div class="dhikr-note">${step.note}</div>` : ''}
        ${step.conditional ? `
        <div class="skip-btn" onclick="skipStep()" role="button">
          <span>تخطي — لا ينطبق الآن</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>` : ''}
        <div class="dhikr-scroll-area">
          <div class="dhikr-text-wrap" id="dhikrScroll"><div class="dhikr-text">${step.text}</div></div>
          <div class="scroll-fade hidden" id="scrollFade">
            <svg class="scroll-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#c9a25c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>

      <div class="bottom-block">
        ${centerHtml}
        <div class="btn-row">
          <div class="undo-btn" onclick="goPrev()" title="الذكر السابق" role="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M13 7l5 5-5 5M6 7l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="undo-btn" onclick="undo()" title="تراجع خطوة بالعدّ" role="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 14l-5-5 5-5M4 9h10a6 6 0 016 6v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div class="progress-strip">
          <div class="progress-label">${toArabicNum(i+1)} / ${toArabicNum(steps.length)}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      </div>
    </div>
  `;
}

function updateScrollFade(){
  const wrap = document.getElementById('dhikrScroll');
  const fade = document.getElementById('scrollFade');
  if(!wrap || !fade) return;
  const hasMore = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight > 4;
  fade.classList.toggle('hidden', !hasMore);
}
const _origRender = render;
render = function(){
  _origRender();
  requestAnimationFrame(() => {
    updateScrollFade();
    const wrap = document.getElementById('dhikrScroll');
    if(wrap) wrap.addEventListener('scroll', updateScrollFade);
  });
};

loadState();

if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
