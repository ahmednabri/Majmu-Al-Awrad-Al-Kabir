<!DOCTYPE html>

<style>
  :root{
    --bg: #090f0d;
    --surface: rgba(255,255,255,0.045);
    --surface-2: rgba(255,255,255,0.075);
    --gold: #c9a25c;
    --gold-bright: #f3d495;
    --ink: #f4efe2;
    --ink-dim: #9fb0a4;
    --ink-faint: #66796d;
    --divider: rgba(232,198,126,0.16);
    --shadow: 0 10px 30px -12px rgba(0,0,0,0.55);
    --radius-lg: 22px;
    --radius-md: 16px;
    --card-solid: rgba(8,13,11,0.88);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(1000px 700px at 15% -8%, rgba(201,162,92,0.16), transparent 55%),
      radial-gradient(900px 750px at 100% 8%, rgba(90,150,120,0.12), transparent 55%),
      radial-gradient(1100px 900px at 50% 115%, rgba(120,90,50,0.10), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Cairo', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden;
  }
  .shell{ width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; padding:20px 18px 26px; }
  @media (min-width: 720px){
    .shell{ max-width:620px; padding-top:32px; }
  }
  @media (min-width: 1080px){
    .shell{ max-width:760px; }
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 4px 16px; position:sticky; top:0; z-index:5;
    background:linear-gradient(to bottom, var(--bg) 60%, transparent);
    margin:-8px -4px 4px;
  }
  .brand{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .brand .title{ font-family:'Amiri', serif; font-weight:700; font-size:23px; color:var(--gold-bright); letter-spacing:.2px; }
  .brand .subtitle{ font-size:11.5px; color:var(--ink-faint); line-height:1.5; }
  .topbar-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .icon-btn{
    background:var(--card-solid); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--divider); color:var(--ink-dim);
    width:40px;height:40px; border-radius:13px; display:flex;align-items:center;justify-content:center;
    cursor:pointer; transition:background .18s ease, color .18s ease, transform .12s ease; flex-shrink:0;
  }
  .icon-btn:hover{color:var(--gold-bright); background:var(--surface-2);}
  .icon-btn:active{transform:scale(0.9);}

  .method-badge{
    display:inline-block; font-size:11.5px; color:var(--gold); background:rgba(201,162,92,0.12);
    border:1px solid var(--divider); border-radius:20px; padding:5px 14px; margin-bottom:14px; align-self:flex-start;
    font-weight:600;
  }

  .progress-strip{ display:flex; align-items:center; gap:10px; width:100%; margin-bottom:2px; }
  .progress-track{ flex:1; height:4px; background:rgba(232,198,126,0.14); border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius:4px; transition:width .4s cubic-bezier(.4,0,.2,1); box-shadow:0 0 10px rgba(240,207,140,0.35); }
  .progress-label{ font-size:12px; color:var(--ink-faint); white-space:nowrap; font-variant-numeric: tabular-nums; }

  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:20px; }

  .dhikr-card{
    width:100%;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
      var(--card-solid);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--divider); border-radius:var(--radius-lg);
    padding:24px 22px; text-align:center; min-height:120px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    max-height:56vh; box-shadow:var(--shadow);
  }
  .dhikr-scroll-area{ position:relative; width:100%; min-height:0; flex:1; display:flex; }
  .dhikr-text-wrap{ width:100%; max-height:100%; overflow-y:auto; scrollbar-width:thin; }
  .scroll-fade{
    position:absolute; left:0; right:0; bottom:0; height:34px; border-radius:0 0 var(--radius-lg) var(--radius-lg);
    background:linear-gradient(to bottom, rgba(8,13,11,0), var(--card-solid) 85%);
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:2px;
    pointer-events:none; opacity:1; transition:opacity .2s ease;
  }
  .scroll-fade.hidden{ opacity:0; }
  .scroll-chevron{ animation: bounce-down 1.2s ease-in-out infinite; }
  @keyframes bounce-down{ 0%,100%{ transform:translateY(0); opacity:0.9; } 50%{ transform:translateY(4px); opacity:0.5; } }
  .dhikr-note{
    font-size:14.5px; color:var(--gold-bright); background:rgba(201,162,92,0.10);
    border:1px dashed rgba(232,198,126,0.32); border-radius:11px; padding:7px 12px;
    width:100%; line-height:1.55; font-weight:700; flex-shrink:0;
  }
  .dhikr-text{ font-family:'Amiri Quran','Amiri', serif; font-size:20px; line-height:2.2; color:var(--ink); white-space:pre-line; }
  @media (min-width: 720px){ .dhikr-text{ font-size:22px; } }
  .bayt-line{ display:flex; justify-content:space-between; align-items:baseline; gap:14px; width:100%; }
  .bayt-line span{ flex:1; text-align:center; }
  .bayt-radif{ margin-top:8px; opacity:0.85; font-size:0.92em; text-align:center; }

  .bottom-block{ display:flex; flex-direction:column; align-items:center; gap:16px; padding-bottom:4px; }

  .ring-wrap{ position:relative; width:230px; height:230px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ring-glow{ position:absolute; inset:-22px; border-radius:50%; background:radial-gradient(circle, rgba(201,162,92,0.22), transparent 70%); opacity:0; transition:opacity .4s ease; pointer-events:none; }
  .ring-wrap.active .ring-glow{opacity:1;}
  svg.ring{ width:100%; height:100%; transform:rotate(-90deg); cursor:pointer; }
  .bead{ transition: fill .25s ease, r .25s ease; }
  .center-btn{
    position:absolute; inset:32px; border-radius:50%;
    background:radial-gradient(circle at 35% 28%, rgba(255,255,255,0.09), rgba(255,255,255,0.02) 70%), var(--bg);
    border:1px solid var(--divider);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
    transition:transform .1s ease, box-shadow .25s ease;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.35), 0 6px 18px -8px rgba(0,0,0,0.5);
  }
  .center-btn:active{transform:scale(0.95);}
  .center-btn.done{ box-shadow: inset 0 0 30px rgba(201,162,92,0.22), 0 0 30px rgba(201,162,92,0.28); }
  .count-num{ font-family:'Amiri', serif; font-size:42px; font-weight:700; color:var(--gold-bright); line-height:1; font-variant-numeric: tabular-nums; }
  .count-target{ font-size:12.5px; color:var(--ink-faint); margin-top:6px; }
  .lap-tag{ position:absolute; top:12px; font-size:11px; color:var(--gold); background:rgba(201,162,92,0.14); padding:3px 10px; border-radius:20px; border:1px solid var(--divider); }

  .check-btn{
    width:230px;height:230px; border-radius:50%;
    background:radial-gradient(circle at 35% 28%, rgba(255,255,255,0.09), rgba(255,255,255,0.02) 70%), var(--bg);
    border:1px solid var(--divider);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .1s ease, box-shadow .25s ease;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.35), 0 6px 18px -8px rgba(0,0,0,0.5);
  }
  .check-btn:active{transform:scale(0.95);}
  .check-btn.done{ box-shadow: inset 0 0 30px rgba(201,162,92,0.24), 0 0 32px rgba(201,162,92,0.3); }
  .check-mark{ width:60px;height:60px; transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1); }

  .undo-btn{
    width:46px;height:46px; border-radius:14px; border:1px solid var(--divider);
    background:var(--card-solid); backdrop-filter:blur(10px); color:var(--ink-faint);
    display:flex;align-items:center;justify-content:center; cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  .undo-btn:hover{color:var(--gold-bright); background:var(--surface-2);}
  .undo-btn:active{transform:scale(0.92);}

  .btn-row{ display:flex; align-items:center; gap:12px; }

  .skip-btn{
    padding:10px 16px; border-radius:14px; border:1px dashed rgba(232,198,126,0.35);
    background:rgba(201,162,92,0.08); color:var(--gold-bright);
    font-family:'Cairo', sans-serif; font-size:13px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    transition:background .15s ease;
  }
  .skip-btn:hover{ background:rgba(201,162,92,0.16); }

  .footer-note{ text-align:center; color:var(--ink-faint); font-size:11px; margin-top:16px; line-height:1.9; }

  .end-screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:20px 0; }
  .end-screen .end-title{ font-family:'Amiri', serif; font-size:29px; color:var(--gold-bright); text-shadow:0 0 24px rgba(240,207,140,0.25); }
  .end-screen p{color:var(--ink-dim); font-size:14px; max-width:320px; line-height:1.9;}
  .restart-btn{
    margin-top:6px; padding:15px 36px; border-radius:16px; border:none;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold) 60%, #a9814a); color:#1c1508;
    font-family:'Cairo', sans-serif; font-weight:700; font-size:14.5px; cursor:pointer;
    box-shadow:0 10px 26px -10px rgba(201,162,92,0.55);
    transition:transform .12s ease, box-shadow .2s ease;
  }
  .restart-btn:active{ transform:scale(0.97); }
  .secondary-btn{
    margin-top:2px; padding:12px 28px; border-radius:16px; border:1px solid var(--divider);
    background:var(--card-solid); backdrop-filter:blur(10px); color:var(--ink-dim);
    font-family:'Cairo', sans-serif; font-weight:600; font-size:13.5px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .secondary-btn:hover{ color:var(--ink); background:var(--surface-2); }

  .menu-screen{ flex:1; display:flex; flex-direction:column; gap:14px; padding-top:6px; }
  .menu-intro{ text-align:center; color:var(--ink-dim); font-size:13px; line-height:1.9; margin-bottom:4px; }
  .method-group-label{ font-size:12.5px; color:var(--ink-faint); margin:6px 4px 0; font-weight:600; }
  .method-card{
    width:100%; text-align:right; position:relative; overflow:hidden;
    background:
      linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
      var(--card-solid);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--divider); border-radius:var(--radius-md);
    padding:17px 19px; cursor:pointer; display:flex; flex-direction:column; gap:5px;
    transition:background .18s ease, border-color .18s ease, transform .1s ease, box-shadow .2s ease;
    box-shadow:0 8px 20px -14px rgba(0,0,0,0.6);
  }
  .method-card::before{
    content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold)); opacity:0; transition:opacity .18s ease;
  }
  .method-card:active{ transform:scale(0.985); }
  .method-card:hover{ background:linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03)); border-color:rgba(232,198,126,0.4); box-shadow:0 10px 26px -12px rgba(201,162,92,0.25); }
  .method-card:hover::before{ opacity:1; }
  .method-card .m-name{ font-family:'Amiri', serif; font-size:18.5px; color:var(--gold-bright); }
  .method-card .m-desc{ font-size:12px; color:var(--ink-faint); line-height:1.8; }

  @media (min-width: 720px){
    .menu-screen{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-content:start; }
    .menu-intro, .method-group-label{ grid-column:1 / -1; }
  }

  .ring-wrap.compact{ width:158px; height:158px; }
  .ring-wrap.compact .center-btn{ inset:22px; }
  .ring-wrap.compact .count-num{ font-size:29px; }
  .ring-wrap.compact .count-target{ font-size:10.5px; margin-top:3px; }
  .ring-wrap.compact .lap-tag{ font-size:10px; padding:2px 8px; top:8px; }
  .check-btn.compact{ width:158px; height:158px; }
  .check-btn.compact .check-mark{ width:42px; height:42px; }

  @media (hover:none){ .method-card:hover, .icon-btn:hover, .undo-btn:hover{ background:inherit; } }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>
<div class="shell" id="shell"></div>


<script>
const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicNum(n){ return String(n).split('').map(c => /[0-9]/.test(c) ? AR_DIGITS[+c] : c).join(''); }

/* ============================================================
   البيانات: الأساس (الصغير والكبير بطرقه الثلاث)
   ============================================================ */
const TAWASSUL_NABI_TEXT = `لَكَ الحَمْدُ مَا لَاحَتْ بَوَارِقُ حَضْرَةِ
لَكَ الحَمْدُ مَا لَاحَتْ بَوَارِقُ حَضْرَةِ

وَأَسْأَلُكَ اللَّهُمَّ يَا عَالِمَ النَّجْوَى
تُصَلِّ عَلَى الْمُخْتَارِ وَاتْبَعْ تَحِيَّتِي

عَلَيْهِ وَآلٍ وَالصَّحَابِ وَحِزْبِهِ
وَتَقَبَّلْ دُعَائِي يَا مُجِيبُ لِدَعْوَتِي

(وَبَعْدُ) فَإِنَّ الْعَبْدَ مُحَمَّدَ عُثْمَانَ
يُبْدِي تَوَسُّلاً يَكْشِفَنَّ لِكُرْبَةِ

وَيَأْخُذُ بِيَدِ الطَّالِبِينَ لَهُ مِنَ
الْأَنَامِ وَهَذَا الْخَتْمُ يَرْجُو لِخَتْمَةِ

وَذَا الْمِيرْغَنِيُّ الْمَكِّيُّ يَقُولُ أَيَا عَلِي
تُبَلِّغُنِي الْمَقْصُودَ تُعْلِي لِرُتْبَتِي

وَهَا نَحْنُ بِأَسْمَاءِ النَّبِيِّ مُحَمَّدٍ
نُقِيمُ تَوَسُّلَنَا بِخَيْرِ وَسِيلَةِ

وَنَنْظِمُ أَسْمَاهُ كَدُرٍّ مُنَظَّمٍ
وَإِنَّهَا يَا حِبِّي طَرِيقَةُ حَضْرَتِي

فَيَا رَبِّ يَا رَحْمَنُ بِأَسْمَائِكَ الْحُسْنَى
وَبِأَسْمَاءِ طَهَ الْمُصْطَفَى سِرِّ رَحْمَةِ

مُحَمَّدُ أَوْصَافٍ وَأَحْمَدُ أَفْعَالِ
وَحَامِدُ مَوْلَاهُ بِأَكْمَلِ وَصْفَةِ

وَمَحْمُودُ سِيرَتِهِ لَقَدْ أَوْضَحَ الْجَلَا
أَحِيدُ بِمَظْهَرِهِ وَحِيدٌ بِأَزْمَةِ

وَمَاحٍ لِظُلْمَاتٍ وَحَاشِرُ لِرَحْمَةِ
وَعَاقِبُ بِالْأَنْوَارِ لِأَهْلِ الْمَوَدَّةِ

بَطَهَ الَّذِي طَهَّرْتَهُ مِنْ إِسَاءَةٍ
وَيَسَ ذِيَّاكَ السَّنَاءُ بِسَطْعَةِ

بِطَاهِرٍ مِنْ كَوْنٍ مُطَهَّرِ كُلِّ رِجْسٍ
بِطَيِّبِ أَنْفَاسٍ بِسَيِّدِ النُّبُوَّةِ

رَسُولٌ إِلَى الْكَوْنَيْنِ جَمْعاً وَإِنَّهُ
نَبِيُّ مَنْبَا وَهُوَ رَسُولُ لِرَحْمَةِ

بِقَيِّمِ أَهْلِ الْحَقِّ يَا حَقُّ نَسْأَلُكْ
وَجَامِعِهِم فِي حَضْرَةِ الْقُدْسِ مُثْبِتِ

وَمُقْتَفِ أَنْبَاءِ تَقَدَّمَ قَبْلَه
مُقَفَّى بِإِمْدَادٍ وَسِرِّ الْخِزَانَةِ

رَسُولُ الْمَلَاحِمِ مُخْبِرٌ عَنْ جَمِيعِهَا
كَذَاكَ رَسُولُ الرَّاحَةِ الْمُسْتَدِيمَةِ

بِكَامِلِ حُسْنٍ مَنْ هُوَ إِكْلِيلُ أَحْبَابٍ
بمُدَّثِرٍ بِالنُّورِ فِي كُلِّ وَقْعَةِ

وَأَنَّهُ عَبْدُ اللَّهِ سِرُّ الْعُبُودَةِ
وَأَنَّهُ عَبْدُ اللَّهِ سِرُّ الْعُبُودَةِ

كِفَانَا حَبِيبُ اللَّهِ فِي كُلِّ مَوْطِنٍ
وَإِنَّ صَفِيَّ اللَّهِ صَفْوُ الْخَلِيقَةِ

بِحَقِّ نَجِيِّ اللَّهِ فِي كُلِّ مُهِمَّةٍ
نَلُوذُ وَإِنَّ كَلِيمَ رَبِّي كِفَايَتِي

وَيَا خَاتِماً لِلْأَنْبِيَاءِ وَمُرْسَلاً
وَيَا مُحْيِيَ دِينِ اللَّهِ أُحْيِي لِمُضْغَتِي

وَيَا خَاتِماً لِلْأَنْبِيَاءِ وَمُرْسَلاً
وَيَا مُحْيِيَ دِينِ اللَّهِ أُحْيِي لِمُضْغَتِي

 {n:"اللَّهُمَّ أَذْهِبْ عَنِّي الْهَمَّ وَالْحَزَنَ آمِينَ", t:3, note:"ثُمَّ تَضَعُ يَدَكَ عَلَى رَأْسِكَ، وَتُكَرِّرُهَا (ثَلَاثاً)"},
 {n:"اللَّهُمَّ إِنِّي أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ كُلِّ نَفْسٍ وَلَمْحَةٍ وَلَحْظَةٍ، وَطَرْفَةٍ يَعْرِفُ بِهَا أَهْلُ السَّمَوَاتِ وَأَهْلُ الْأَرْضِ، وَكُلِّ شَيْءٍ هُوَ فِي عِلْمِكَ، كَائِنَّ أَوْقَدَ كَانَ", t:1, note:"ثم تقول"},
 {n:"أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:", t:1, note:"ثم تقول"},
 {n:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَوَاتِ وَمَا فِي الْأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ ۝٢٥٥", t:1, note:"ثم تقرأ آية الكرسي"},
 {n:"سُبْحَانَ اللهِ", t:33, note:"ثم تنزل يدك من رأسك، وتكررها (ثلاثة وثلاثون)"},
 {n:"الحَمْدُ للهِ", t:33, note:"ثم تكررها (ثلاثة وثلاثون)"},
 {n:"اللهُ أَكْبَرُ", t:33, note:"ثم تكررها (ثلاثة وثلاثون)"},
 {n:"لَا إِلَهَ إِلَّا اللَّهُ، وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", t:1, note:"وفي تمام المائة تقولها (مرة واحدة)"},
 {n:"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", t:3, note:"ثم تكررها (ثلاثاً)"},
 {n:"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنك رَحْمَةً إِنَّكَ أَنتَ الْوَهَّابُ", t:3, note:"ثم تكررها (ثلاثاً)"},
 {n:"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ ، الحَمْدُ لِلَّهِ وَالشُّكْرُ لِلَّهِ، حَمْدَاً وَشُكْراً مِنَ اللهِ إِلى اللهِ، كَمَا يَلِيقُ بِعَظَمَةِ ذَاتِ اللَّهِ، فِي كُلِّ لَمْحَةٍ وَنَفَسٍ، عَدَدَ مَا وَسِعَهُ عِلْمُ اللَّهِ", t:1, note:"ثم تقول مرة واحدة"},
 {n:"اللَّهُمَّ صَلِّ وَسَلَّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ، صَلَاةً أَنَالُ بِبَرَكَتِهَا حُسْنَ الْخِتَامِ، صَلَاةً بِعَدَدِ أَنْوَارِ اتَّجَلِّيَاتِ اللَّهِ لِسَيِّدِ الأَنَامِ، وَعَلَى آلِهِ وَصَحْبِهِ السَّلَامُ", t:1, note:"ثم تقول مرة واحدة"},
 {n:"اللَّهُمَّ إِنِّي أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ، كُلُّ نَفْسٍ وَلَمْحَةٍ وَلَحْظَةٍ، وَطَرْفَةٍ يَعْرِفُ بِهَا أَهْلُ السَّمَوَاتِ، وَأَهْلُ الْأَرْضِ، وَكُلِّ شَيْءٍ هُوَ فِي عِلْمِكَ، كَائِنُ أَوْقَدَ كَانَ", t:1, note:"ثم تقول"},
 {n:"أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:", t:1, note:"ثم تقول"},
 {n:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَوَاتِ وَمَا فِي الْأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ ۝٢٥٥", t:1, note:"ثم تقرأ (آية الكرسي ورقمها 255 من سورة البقرة)"},
 {n:"أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:", t:1, note:"ثم تقول"},
 {n:"لله مَا فِي السَّمَوَاتِ وَمَا فِي الْأَرْضِ وَإِن تُبْدُوا مَا فِي أَنفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُم بِهِ اللَّهُ فَيَغْفِرُ لِمَن يَشَاءُ وَيُعَذِّبُ مَن يَشَاءُ وَاللَّهُ عَلَى كُلِّ شَيْءٍ قَدِيرُ ۝٢٨٤ ءَامَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ، وَالْمُؤْمِنُونَ كُلُّ ءَامَنَ بِاللَّهِ وَمَلَكَيْهِ، وَكُتُبِهِ وَرُسُلِهِ لا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ، وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝٢٨٥ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ۝٢٨٦", t:1, note:"ثم تقرأ الآيات رقم 284 و 285 و 286 من سورة البقرة (وهي خواتيم البقرة)"},
 {n:"أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:", t:1, note:"ثم تقول"},
 {n:"شَهِدَ اللَّهُ أَنَّهُ لَا إِلَهَ إِلَّا هُوَ وَالْمَلَائِكَةُ وَأُولُوا الْعِلْمِ قَائِمًا بِالْقِسْطِ لَا إِلَهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ ۝١٨ إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ ۝١٩", t:1, note:"ثم تقرأ الآية رقم 18 إلى قوله الإسلام من سورة آل عمران"},
 {n:"أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:", t:1, note:"ثم تقول"},
 {n:"قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاءُ وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاءُ وَتُعِزُّ مَن تَشَاءُ وَتُذِلُّ مَن تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ۝٢٦ تُولِجُ الَّيْلَ فِي النَّهَارِ وَتُولِجُ النَّهَارَ فِي الَّيْلِ وَتُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَتُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ وَتَرْزُقُ مَن تَشَاءُ بِغَيْرِ حساب ۝٢٧", t:1, note:"ثم تقرأ الآيتين رقم 26 و 27 من سورة آل عمران"},
 {n:"أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:", t:1, note:"ثم تقول"},
 {n:"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\n( قُلْ هُوَ اللهُ أَحَدُ ۝١ اللهُ الصَّمَدُ ۝٢ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝٣ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ۝٤ )", t:3, note:"ثم تقرأ سورة الإخلاص"},
 {n:"أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:", t:1, note:"ثم تقول"},
 {n:"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\n( قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝١ مِن شَرِّ مَا خَلَقَ ۝٢ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝٣ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝٤ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ۝٥ )", t:1, note:"ثم تقرأ سورة الفلق"},
 {n:"أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:", t:1, note:"ثم تقول"},
 {n:"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\n( قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝١ مَلِكِ النَّاسِ ۝٢ إِلَهِ النَّاسِ ۝٣ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝٤ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝٥ مِنَ الْجِنَّةِ وَالنَّاسِ ۝٦)", t:1, note:"ثم تقرأ سورة الناس"},
 {n:"أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:", t:1, note:"ثم تقول"},
 {n:"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\n( الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝١ الرَّحْمَنِ الرَّحِيمِ ۝٢ مَالِكِ يَوْمِ الدين ۝٣ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝٤ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝٥ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ ۝٦ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ ۝٧ ) آمِينَ", t:1, note:"ثم تقرأ سورة الفاتحة"},
 {n:"اسْتَغْفِرُ اللهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيَّ الْقَيُّومَ، وَأَتُوبُ إِلَيْهِ", t:3, note:"ثُمَّ الاسْتِغْفَارُ الصَّغِيرُ (ثَلَاثاً)"},
 {n:"لَا إِلَهَ إِلَّا اللَّهُ", t:100, note:"خَمْسِينَ بِاللِّسَانِ، وَخَمْسِينَ بِالقَلْبِ، مَعَ تَعْمِيضِ العَيْنَيْنِ"},
 {n:"لَا إِلَهَ إِلَّا اللَّهُ ، مُحَمَّدٌ رَسُولُ اللَّهِ، فِي كُلِّ لَمْحَةٍ وَنَفَسٍ، عَدَدَ مَا وَسِعَهُ عِلْمُ اللَّهِ", t:1, note:"في تمام المائه تقول :"},
 {n:"اللَّهُ", t:100, note:"خَمْسِينَ بِاللِّسَانِ، وَخَمْسِينَ بِالقَلْبِ، مَعَ تَعْمِيضِ العَيْنَيْنِ"},
 {n:"هُوَ", t:100, note:"خَمْسِينَ بِاللِّسَانِ، وَخَمْسِينَ بِالقَلْبِ، مَعَ تَعْمِيضِ العَيْنَيْنِ"},

 {n:"اللَّهُمَّ بِأَلِفِ الابْتِدَاءِ، وَيَاءِ الانْتِهَاءِ، وَبِالصَّفَاتِ العُلَا، وَبِالذَّاتِ يَا أَعْلَى، صَلِّ عَلَى سُلْطَانِ المَمْلَكَةِ، وَإِمَامِ الحَضْرَةِ المُقَدَّسَةِ، المُفِيضِ عَلَى المَلَأُ الأَعْلَى ، مِنْ وَرَاءِ حُجُبِكَ الجِلَا، مَنْ قَامَتْ بِهِ عَوَالِمُ الجَبَرُوتِ، وَظَهَرَتْ عَنْهُ عَوَالِمُ الْمُلْكِ وَالمَلَكُوتِ، المُطَمْطَمِ بِالْأَنْوَارِ العَلِيَّةِ، وَالكَنْزِ الَّذِي لَا يَعْرِفُهُ عَلَى الحَقِيقَةِ إِلَّا مَالِكُ البَرِّيَّةِ، تَرْجُمَانِ الرَّحْمَنِ لِعَبَادِهِ بِالإِحْسَانِ، فِي حَضْرَةِ الامْتِنَانِ بِلِسَانِ اللُّطْفِ وَالحَنَانِ، بِقَوْلِهِ: لَوْ لَمْ تُذْنِبُوا وَتَسْتَغْفِرُوا، لَأَتَى اللَّهُ بِقَوْمٍ يُذْنِبُونَ وَيَسْتَغْفِرُونَ فَيَغْفِرُ لَهُمْ، أَوْ كَمَا قَالَ، الْمُكَمِّلِ لِعِبَادِ اللَّهِ بِالتَّفْحَاتِ الفَرْدِيَّةِ، وَالْمُؤَيِّدِ لَهُمْ بِالظُّهُورَاتِ الْأُنْسِيَّةِ، وَالعَرْشِ كَمَا يَلِيقُ بِهِمَا، مَنْ ظَهَرَ الرَّبُّ مِنْ أَجْلِهِ مِنَ العَمَا، ذِرْوَةِ الدَّوَاوِينِ الإِلَهِيَّةِ، تَرْجُمَانِ الحَضَرَاتِ الصَّمَدَانِيَّةِ، رُوحِ المَعَارِفِ العِلْمِيَّةِ وَمَادَّةِ الحَقَائِقِ النُّورَانِيَّةِ، المُتَجَلِّي فِي سَمَاءِ الرُّبُوبِيَّةِ، وَلَمْ يَفْهَمْ ذَلِكَ سِوَى أَهْلِ المُتَّكَاتِ البَسْطِيَّةِ، قَلْبِ القُلُوبِ الوَاسِعَةِ لِلبَر، وَالقُرْآنِ الَّذِي حَوَى سِرَّ المُقَدَّمِ وَالمُؤَخَّرِ، فَمَا فِي الْإِمْكَانِ، بِحَسَبِ مَا قَضَاهُ الدَّيَّانُ، أَبْدَعُ مِنْهُ عِنْدَ مَوْلَاهُ، وَلَا عِنْدَ مَنْ تَجَلَّى عَلَيْهِ اللهُ، فَهُوَ البَاطِنُ الَّذِي مِنْهُ يُرَى اللهُ، وَهُوَ الظَّاهِرُ الَّذِي بِهِ يَتَجَلَّى اللهُ اللَّهُمَّ بِالسَّاجِدِ عِنْدَ العَرْشِ، وَمَنْ هُوَ سِرُّ العَرْشِ ادْخِلْنَا فَوْقَ الفَرْشِ، وَاحْمِلْنَا إِلَى الدِّيوَانِ الأَعْلَى، مَعَ الدِّيوَانِ الأَجْلَى، عَلَى بَاطِنِ مَنْبَعِ سِرِّ إِنِّي أَبِيتُ عِنْدَ رَبِّي يَطْعِمُنِي وَيَسْقِينِي، فَسُبْحَانَ الَّذِي بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَإِلَيْهِ تُرْجَعُونَ", t:1, note:"ثم تقول :"},

const STEPS_CACHE = {};
function getSteps(method){
  if(!method) return [];
  if(!STEPS_CACHE[method]){
    const overrides = OVERRIDES[method] || {};
    STEPS_CACHE[method] = SAGHEER_RAW.map((step, i) => {
      const ov = overrides[i];
      return {
        text: step.text,
        target: ov && ov.t !== undefined ? ov.t : step.target,
        note: ov && ov.note !== undefined ? ov.note : step.note,
        halfSplit: HALF_SPLIT_INDICES.has(i),
      };
    });
  }
  return STEPS_CACHE[method];
}

 {n:`اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَوَاتِ وَمَا فِي الْأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ ۝٢٥٥`, t:1, note:`ثم تقرأ (آية الكرسي و رقمها 255 من سورة البقرة)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`لِلَّهِ مَا فِي السَّمَوَاتِ وَمَا فِي الْأَرْضِ وَإِن تُبْدُوا مَا فِي أَنفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُم بِهِ اللَّهُ فَيَغْفِرُ لِمَن يَشَاءُ وَيُعَذِّبُ مَن يَشَاءُ وَاللَّهُ عَلَى كُلِّ شَيْءٍ قَدِيرُ ۝٢٨٤ ءَامَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ، وَالْمُؤْمِنُونَ كُلُّ ءَامَنَ بِاللَّهِ وَمَلَ بِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ، وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝٢٨٥ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ۝٢٨٦`, t:1, note:`ثم تقرأ الآيات رقم 284 و 285 و 286 من سورة البقرة (وهي خواتيم البقره)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`شَهِدَ اللَّهُ أَنَّهُ لَا إِلَهَ إِلَّا هُوَ وَالْمَلَائِكَةُ وَأُولُوا الْعِلْمِ قَائِمًا بِالْقِسْطِ لَا إِلَهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ ۝١٨ إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ`, t:1, note:`ثم تقرأ الآية رقم 18 الي قوله الإسلام من سورة آل عمران`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاءُ وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاءُ وَتُعِزُّ مَن تَشَاءُ وَتُذِلُّ مَن تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ۝٢٦ تُولِجُ الَّيْلَ فِي النَّهَارِ وَتُولِجُ النَّهَارَ فِي الَّيْلِ وَتُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَتُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ وَتَرْزُقُ مَن تَشَاءُ بِغَيْرِ حساب۝٢٧`, t:1, note:`ثم تقرأ الآيتان رقم 26 و 27 من سورة آل عمران.`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`يَا رَبُّ، يَا رَحْمنُ، يَا عَظِيمُ، أَسْأَلُكَ تَجَلِّياً، يُذْهِبُ عَنِّي حُجُبَ النَّفْسِ الظُّلْمَانِيَّةِ، يَا فَرْدُ، يَا أَحَدُ، يَا نُورُ، تَجَلَّ لِي بِالتَّجَلِّيَاتِ الصَّمَدَانِيَّةِ، يَا مُعْطِي، يَا بَاسِطُ، يَا وَاسِعُ اجْعَلْ قَلْبِي بَيْتًا مَمْلُوءاً بِالْأَنْوَارِ الرَّحْمَانِيَّةِ، يَا حَفِيظٌ، يَا كَرِيمُ، يَا وَهَّابُ، هَبْ لِي مِنْ نَفْسِي فُرْقَانَا، اهْتَدِي بِهِ فِي الظُّلُمَاتِ الكَوْنِيَّةِ، وَارْزُقْنِي الأَطْمِثْنَانَ، أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُ الْقُلُوبُ، يَا مَنْ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ، وَهُوَ عَلَّامُ الغُيُوبِ، وَعَرَّفْنِي بِالعُلُومِ الكَمَالِيَّةِ، حَتَّى أَكُونَ وَارِثاً لِلحَضْرَةِ الْأَحْمَدِيَّةِ، سُبْحَانَكَ أَنْتَ الَّذِي تَعَزَّزْتَ بِالوَحْدَانِيَّةِ، لَكَ الحَمْدُ كَمَا يَنْبَغِي لِصِفَاتِكَ العَلِيَّةِ`, t:1, note:`ثم تقول`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`اللَّهُمَّ ارْزُقْنَا الاسْتِقَامَةَ، عَلَى قَدَمِ صَاحِبِ المُعْجِزَاتِ وَالكَرَامَةِ، جَزَيَ اللَّهُ عَنَّا نَبِيَّنَا مُحَمَّداً، صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، مَا هُوَ أَهْلُهُ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`فَسُبْحَانَ اللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ ۝١٧ وَلَهُ الْحَمْدُ فِي السَّمَوَاتِ وَالْأَرْضِ وَعَشِيًّا وَحِينَ تُظْهِرُونَ ۝١٨ يُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَيُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ وَيُحْيِ الْأَرْضَ بَعْدَ مَوْتِهَا وَكَذَلِكَ تُخْرَجُونَ ۝١٩`, t:1, note:`ثم تقرأ الآيات رقم 17 و 18 و 19 من سورة الروم.`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ ۝١٨٠ وَسَلَامُ عَلَى الْمُرْسَلِينَ ۝١٨١ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ۝١٨٢`, t:3, note:`ثم تقرأ الآيات رقم 180 و 181 و 182 من سورة الصافات (وهي أواخر السورة).`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`سُبْحَانَ اللَّهِ مِلْءَ المِيزَانِ، وَمُنْتَهَى العِلْمِ، وَمَبْلَغَ الرَّضَى، وَ زِنَةَ العَرْشِ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`سُبْحَانَ الدَّائِمَ القَائِمِ، سُبْحَانَ القَائِمِ الدَّائِمِ، سُبْحَانَ الحَيِّ القَيُّومِ، سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ الله العظيمِ وَبِحَمْدِهِ، سُبْحَانُ المَلِكِ القُدُّوسِ، سُبْحَانَ رَبِّ المَلَائِكَةِ وَالرُّوحِ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ، وَحْدَهُ لَا شَرِيكَ لَهُ، إِلَهَا وَاحِداً أَحَداً، فَرْداً صَمَداً ، لَمْ يَتَّخِذْ صَاحِبَةً وَلَا وَلَداً، وَلَمْ يَكُنْ لَهُ كُفُواً أَحَدٌ`, t:10, note:`وَتَقُولُ فِي رَاتِبِ الصُّبْحِ فَقَطْ`, c:true},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`رَضِيتُ بِاللَّهِ تَعَالَى رَبَّاً، وَبِالإِسْلَامِ دِيناً، وَبِسَيِّدِنَا مُحَمَّدٍ، صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، نَبِيَّاً وَرَسُولاً`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`يَا مُقَلِّبَ الْقُلُوبِ، ثَبِّتْ قَلْبِي عَلَى دِينِكَ`, t:3, note:`ثم تكررها ثلاثاً`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`يَا وَلِيُّ الْإِسْلَامِ وَأَهْلِهِ، ثَبِتْنِي بِهِ حَتَّى أَلْقَاكَ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ، أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ، لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشَّكْر`, t:3, note:`وَعِندَ المَسَاءِ تَقُول : أَمْسَيْ بَدَلِ أَصْبَحْ`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`اللَّهُمَّ إِنِّي أَصْبَحْتُ مِنْكَ فِي نِعْمَةٍ وَعَافِيَةٍ وَسِتْرٍ، فَأَتِمَّ نِعْمَتَكَ عَلَيَّ، وَعَافِيَتَكَ، وَسِتْرَكَ فِي الدُّنْيَا وَالْآخِرَةِ`, t:3, note:`وَعِندَ المَسَاءِ تَقُول : أَمْسَيْتُ بَدَلِ أَصْبَحْتُ`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`لَقَدْ جَاءَكُمْ رَسُولٌ مِّنْ أَنفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُمْ حَرِيصٌ عَلَيْكُم بِالْمُؤْمِنِينَ رَءُوفٌ رَّحِيمٌ`, t:1, note:`ثم تقرأ الآية رقم 128 من سورة التوبة`},
 {n:`فَإِن تَوَلَّوْا فَقُلْ حَسْبِي اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ`, t:7, note:`ثم تكرر الآية التي تليها (سبعاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`يَا اللَّهُ، يَا وَدُودُ يَا حَقُّ`, t:21, note:`ثم تكررها (احدي و عشرين ) مره ماداً بها صوتك`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`اللَّهُمَّ إِنِّي أَسْأَلُكَ بِنُورِ وَجْهِ اللهِ الْعَظِيمِ الَّذِي مَلأَ أَرْكَانَ عَرْشِ اللَّهِ الْعَظِيمِ، وَقَامَتْ بِهِ عَوَالِمُ اللهِ الْعَظِيمِ، أَنْ تُصَلَّى عَلَى سَيِّدِنَا وَمَوْلَانَا مُحَمَّدٍ ذِي الْقَدْرِ الْعَظِيمِ، وَعَلَى آلِ نَبِيِّ اللَّهِ الْعَظِيمِ، بِقَدْرِ عَظَمَةِ ذَاتِ اللَّهِ الْعَظِيمِ، فِي كُلِّ لَمْحَةٍ وَنَفَسٍ، عَدَدَ مَا فِي عِلْمِ اللهِ الْعَظِيمِ، صَلَاةً دَائِمَةً بِدَوَامِ اللَّهِ الْعَظِيمِ، تَعْظِيماً لِحَقَّكَ يَا مَوْلَانَا يَا مُحَمَّدٍ، يَا ذَا الْخُلُقِ الْعَظِيمِ، وَسَلَّمْ عَلَيْهِ وَعَلَى آلِهِ مِثْلَ ذَلِكَ، وَاجْمَعْ بَيْنِي وَبَيْنَهُ، كَمَا جَمَعْتَ بَيْنَ الروحِ وَالنَّفْسِ، ظَاهِراً وَبَاطِناً يَقَظَةً وَمَنَامَاً، وَاجْعَلْهُ يَا رَبِّ رُوحاً لِذَاتِي مِنْ جَمِيعِ الْوُجُوهِ، فِي الدُّنْيَا قَبْلَ الْآخِرَةِ يَا عَظِيمُ`, t:1, note:`ثم الصلاة العظمية`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`صَلَوَاتُ اللهِ تَعَالَى، وَمَلَائِكَتِهِ وَأَنْبِيَائِهِ، وَرُسُلِهِ، وَجَمِيعِ خَلْقِهِ، عَلَى سَيِّدِنَا مُحَمَّدٍ، وَعَلَى آلِ سَيِّدِنَا مُحَمّدٍ، وَعَلَيْهِ وَعَلَيْهِمْ السَّلامُ، وَرَحْمَةُ اللَّهِ تَعَالَى وَبَرَكَاتُهُ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`اللَّهُمَّ صَلَّ وَسَلَّمْ وَبَارِكَ عَلَى سَيِّدِنَا مُحَمَّدٍ، وَعَلَى آلِهِ وَصَحْبِهِ، بِقَدْرِ عَظَمَةِ ذَاتِكَ يَا أَحَدُ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`اللَّهُمَّ صَلَّ وَسَلَّمْ عَلَى الرَّسُولِ الأَمِينِ الَّذِي قَالَ فِي حَقَّهِ المَلِكُ المُبِينُ: وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ، عَدَدَ مَنْ أُرْسِلَ إِلَيْهِمْ مِنْ الخَلْقِ أَجْمَعِينَ، وَعَلَى آلِهِ وَصَحْبِهِ وَالتَّابِعِينَ، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ، يَا رَبَّ العَالَمِينَ . آمِينَ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`اللَّهُمَّ صَلَّ وَسَلَّمْ وَبَارِكْ عَلَى سَيِّدِنَا وَمَوْلاَنَا مُحَمَّدٍ، وَعَلَى آلِ سَيِّدِنَا وَمَوْلَانَا مُحَمَّدٍ، بِعَدَدِ كُلِّ ذَرَّةٍ أَلْفَ أَلْفِ كَرَّةٍ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ كُلَّهَا، مِنْ شَرِّ مَا خَلَقَ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ، وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`بِسْمِ اللَّهِ عَلَى دِينِي، وَنَفْسِي، وَوَلَدِي، وَأَهْلِي وَمَالِي`, t:3, note:`ثم تكررها (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`لَا إِلَهَ إِلَّا اللَّهُ، مُحَمَّدٌ رَسُولُ اللَّهِ، فِي كُلِّ لَمْحَةٍ وَنَفَسٍ، عَدَدَ مَا وَسِعَهُ عِلْمُ اللَّهِ`, t:47, note:`ثم تكررها (سبعة و اربعون)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثُمَّ تَضَعُ يَدَكَ عَلَى رَأْسِكَ، وَتَقُولُ:`},
 {n:`أَعُوذُ بِاللهِ السَّمِيعِ العَلِيمِ، مِنَ الشَّيْطَانِ الرَّحِيمِ`, t:3, note:`ثُمَّ تَضَعُ يَدَكَ عَلَى رَأْسِكَ، وَتَقُولُ (ثلاثاً)`},
 {n:`هو اللَّهُ الَّذِي لَا إِلَهَ إِلَّا هُوَ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ هُوَ الرَّحْمَنُ الرَّحِيمُ ۝٢٢ هُوَ اللَّهُ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ الْمُؤْمِنُ الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ ۝٢٣ هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ لَهُ الْأَسْمَاءُ الْحُسْنَى يُسَبِّحُ لَهُ مَا فِي السَّمَوَاتِ وَالْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ ۝٢٤`, t:1, note:`ثم تقرأ الآيات رقم 22 و 23 و 24 من سورة الحشر (وهي أواخر السورة).`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثُمَّ تُنْزِلُ يَدَكَ، وَتَقُولُ`},
 {n:`بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\n( إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا ۝١ وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا ۝٢ وَقَالَ الْإِنسَانُ مَا لَهَا ۝٣ يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا۝٤ بِأَنَّ رَبَّكَ أَوْحَى لَهَا ۝٥ يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِيُرَوْا أَعْمَالَهُمْ ۝٦ فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَه ۝٧ وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ ۝٨`, t:2, note:`ثم تقرأ سورة الزلزله مرتين`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\n( قُلْ يَأَيُّهَا الْكَافِرُونَ ۝١ لَا أَعْبُدُ مَا تَعْبُدُونَ ۝٢ وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ ۝٣ وَلَا أَنَا عَابِدُ مَا عَبَدتُّمْ ۝٤ وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُُ ۝٥ لَكُمْ دِينَكُمْ وَلِيَ دِينِ ۝٦`, t:4, note:`ثم تقرأ سورة الكافرون اربعاً`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\n( قُلْ هُوَ اللَّهُ أَحَدُ ۝١ اللهُ الصَّمَدُ ۝٢ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝٣ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ۝٤`, t:1, note:`ثم تقرأ سورة الإخلاص (ثلاثاً)`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\n( قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝١ مِن شَرِّ مَا خَلَقَ ۝٢ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝٣ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝٤ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ۝٥`, t:1, note:`ثم تقرأ سورة الفلق`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\n( قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝١ مَلِكِ النَّاسِ ۝٢ إِلَهِ النَّاسِ ۝٣ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝٤ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝٥ مِنَ الْجِنَّةِ وَالنَّاسِ ۝٦`, t:1, note:`ثم تقرأ سورة الناس`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`سُبْحَانَ اللهِ، وَالحَمْدُ للهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، عَدَدَ خَلْقِ اللهِ ، وَرِضَا نَفْسِ اللَّهِ، وَزِنَةَ عَرْشِ اللَّهِ، وَمِدَادَ كَلِمَاتِ اللَّهِ`, t:100, note:`ثم تكرر مائه أو خمسون مره`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`اللَّهُمَّ يَا دَائِمَ الْفَضْلِ عَلَى البَرِيَّةِ، يَا بَاسِطَ اليَدَيْنِ بِالْعَطِيَّةِ، يَا صَاحِبَ المَوَاهِبِ السَّنِيَّةِ، صَلِّ عَلَى سَيِّدِنَا مُحَمّدٍ، خَيْرِ الوَرَى بِالسَجِيَّة، وَاغْفِرْ لَنَا يَا ذَا العُلَا فِي هَذِهِ الْعَشِيَّةِ`, t:10, note:`تقرأ ليلة الجمعة و يوم الجمعة`, c:true},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`يَا حَيُّ يَا قَيُّومُ`, t:7, note:`بِمَدِّ الصَّوتِ بِيَاءِ النَّدَاءِ`},
 {n:`يَا حَيُّ يَا قَيُّومُ`, t:66, note:`بِيَاءِ النَّدَاءِ، أَيْضاً بِخِفَّةٍ`},
 {n:`حَيُّ قَيُّومُ`, t:34, note:`يكررها (أربعة وثلاثون)`},
 {n:`يَا حَيُّ يَا قَيُّومُ`, t:1, note:`بِمَدِّ الصَّوتِ بِيَاءِ النَّدَاءِ`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`الفَاتِحَةَ لِقُطْبٍ أَهْلِ الوِصَالِ، مَوْلَانَا مُحَمَّدٍ، عَلَيْهِ أَفْضَلُ الصَّلَاةِ وَالسَّلَامِ مِنَ الكَبِيرِ المُتْعَالِ`, t:1, note:`الفَاتِحَة وَتَقْرَؤُهَا سِراً`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`الفَاتِحَةَ لِسَائِرِ قَادَاتِنَا أَهْلِ النِّيَابَةِ، وَجَمِيعِ سَادَاتِنَا الْأَنْبِيَاءِ وَالصَّحَابَةِ`, t:1, note:`الفَاتِحَة وَتَقْرَؤُهَا سِراً`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`لِجُمْلَةِ أَئِمَّتِنَا الْخُلَفَاءِ الرَّاشِدِينَ، سَادَاتِنَا وَمَوَالِينَا، أَبِي بَكْرٍ وَعُمَرَ وَعُثْمَانَ وَعَلَيَّ، وَالحَسَنِ وَالْحُسَيْنِ أَهْلِ الصَّفَا وَالوَفَا`, t:1, note:`الفَاتِحَة وَتَقْرَؤُهَا سِراً`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`لِسَيِّدَتِنَا فَاطِمَةَ الزَّهْرَاءِ، خِزَانَةِ مَدَدِنَا دُنْيَا وَأُخْرَى، رَضَيَ اللَّهُ تَعَالَى عَنْهَا وَأَرْضَاهَا، وَجَعَلَنَا فِي الدَّارَيْنِ فِي حِمَى أَبِيهَا وَحِمَاهَا`, t:1, note:`الفَاتِحَة وَتَقْرَؤُهَا سِراً`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`لِصَاحِبِ الرَّاتِبِ، تَرْجُمَانِ أَهْلِ الإِحْسَانِ، وَخَتْمِ أَهْلِ الْعِرْفَانِ، أَبِي مُحَمَّدٍ وَحَسَنٍ وَعَبْدِ اللَّهِ وَجَعْفَرٍ وَزَيْنَبَ، وَشَيْخَنَا وَأُسْتَاذِنَا وَمُرَبِّينَا، المِيْرِغَنِي المكي، سَيِّدِنَا السَّيِّدِ مُحَمَّد عُثْمَانَ، وَشَيْخِهِ العَارِفِ بِاللَّهِ النَّفِيسِ سَيِّدِنَا السَّيِّدِ أَحْمَدَ بْنِ إِدْرِيسَ، وَوَالِدِيهِمْ وَذُرْيَاتِهِمْ، وَمَشَايِخِهِمْ وَخُلَفَائِهِمْ، وَأَتْبَاعِهِمْ وَالْمُنْتَسِبِينَ إِلَيْهِمْ أَجْمَعِينَ`, t:1, note:`الفَاتِحَة وَتَقْرَؤُهَا سِراً`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`الفَاتِحَةَ لِلفَرْدِ السَّنِي وَالقُطْبِ الهَنِي، صَاحَبِ السِّرِّ المَوْهُوبِ، سَيِّدِي السَّيِّدِ عَبْدِ اللَّهِ المِيْرِغَنِي المَحْجُوبِ، وَابْنِهِ الوَلِيِّ الْأَفْخَرِ، سَيِّدِنَا السَّيِّدِ مُحَمَّدٍ أَبِي بَكْرٍ، وَ ابْنِ الخَتْمَ المَحْجُوبِ البَابِ، أَمَدَّنَا بِمَدَدِهِمُ يَا وَهَّابُ`, t:1, note:`الفَاتِحَة وَتَقْرَؤُهَا سِراً`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`لِأَهْلِ بَيْتِ رَسُولِ اللَّهِ أَجْمَعَيْنَ، وَجُمْلَةِ الْمُؤْمِنِينَ، وَالصَّالِحِينَ`, t:1, note:`الفَاتِحَة وَتَقْرَؤُهَا سِراً`},
 {n:`أُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ:`, t:1, note:`ثم تقول`},
 {n:`الفَاتِحَةَ وَلْتَخْتِمْ بِهَا لِأَكْمَلِ الْآخِذِينَ عَنِ اللهِ، وَالمَحْبُوبِينَ عِنْدَ اللَّهِ، سَيِّدِنَا وَمَوْلَانَا وَحَبِيبِنَا، وَقُرَّةِ أَعْيُنِنَا وَثَمَرَةِ فُؤَادِنَا، وَنُورِ قُلُوبِنَا، وَسِرِّ عُقُولِنَا، وَشَارِحِ صُدُورِنَا، سَيِّدِنَا وَسَيِّدِ كُلَّ مَنْ لَهُ سِيَادَةٌ فِي الوُجُودِ، أَبِي القَاسِمِ، أَبِي إِبْرَاهِيمَ، أَبِي الزَّهْرَاءِ، سَيِّدِنَا مُحَمَّدٍ المَحْمُودِ، عَلَيْهِ أَفْضَلُ الصَّلَاةِ وَالسَّلَامِ مِنْ المَلِكِ المَعْبُودِ زِيَادَةً فِي شَرَفِهِ، وَعُلُوّ دَرَجَتِهِ، وَعُمُومِ بَرَكَتِهِ، خُصُوصاً بِبَرَكَتِهِ الخَاصَّةِ عَلَيْنَا، وَعَلَى أَهْلِ طَرِيقَتِنَا مِنْ مَشَارِقِ الْأَرْضِ إِلَى مَغَارِبِهَا، أَحْيَاءً وَأَمْوَاتًا أَجْمَعِينَ`, t:1, note:`الفَاتِحَة وَتَقْرَؤُهَا سِراً`},
 {n:`وَأُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ: لَا إِلَهَ إِلَّا اللَّهُ، مُحَمَّدٌ رَسُولُ اللَّهِ، صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فِي كُلِّ لَمْحَةٍ وَنَفَسٍ، عَدَدَ مَا وَسِعَهُ عِلْمُ اللَّهِ`, t:3, note:`ثُمَّ تَضَعُ يَدَيْكَ عَلَى فَخَذَيْكَ، وَتُرْخِي رَأْسَكَ، وَتَقُولُ:`},
 {n:`وَأُقَدِّمُ إِلَيْكَ بَيْنَ يَدَيْ ذَلِكَ كُلِّهِ: اَللَّهُمَّ صَلَّ وَسَلَّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ الْأَمِينِ، وَعَلَى آلِهِ، وَعَلَى سَائِرِ إِخْوَانِهِ مِنَ الأَنْبِيَاء وَالْمُرْسِلِينَ، وَعَلَى جِبْرِيلَ، وَمِيكَائِيلَ، وَإِسْرَافِيلَ، وَمَلَكِ المَوْتِ، وَحَمَلَةِ الْعَرْشِ، وَعَلَى المَلَائِكَةِ أَجْمَعِينَ، وَعَلَى الأَوْلِيَاءِ، وَجَمِيعِ عِبَادِكَ الْمُؤْمِنِينَ، فِي كُلِّ لَمْحَةٍ وَنَفَسٍ، عَدَدَ مَا وَسِعَهُ عِلْمُكَ، آمِينَ`, t:1, note:`ثم تقول`},
 {n:`الصَّلَاةُ وَالسَّلَامُ عَلَيْكَ يَا سَيِّدِي يَا رَسُولَ اللَّهِ الصَّلَاةُ وَالسَّلَامُ عَلَيْكَ يَا سَيِّدِي يَا نَبِيَّ اللهِ ، الصَّلَاةُ وَالسَّلَامُ عَلَيْكَ يَا سَيِّدِي يَا حَبِيبَ اللهِ الصَّلَاةُ وَالسَّلَامُ عَلَيْكَ يَا سَيِّدِي يَا خَلِيلَ الله، الصَّلَاةُ وَالسَّلَامُ عَلَيْكَ يَا سَيِّدِي يَا صَفِيَّ اللَّهِ، صَلَّى اللهُ عَلَيْكَ، وَعَلَى آلِكَ وَأَصْحَابِكَ أَجْمَعِينَ`, t:1, note:`ثُمَّ تَضَعُ يَدَيْكَ عَلَى صَدْرِكَ ، وَتُرْخِي رَأْسَكَ، وَتَقُولُ مَعَ الْحُضُورِ وَالأَدَبِ`},
 {n:`لَا إِلَهَ إِلَّا اللَّهُ، مُحَمَّدُ رَسُولُ اللهِ، فِي كُلِّ لَمْحَةٍ وَنَفَسٍ، عَدَدَ مَا وَسِعَهُ عِلْمُ اللَّهِ`, t:1, note:`ثُمَّ تَرْفَعُ رَأْسَكَ وَتَقُولُ`},
 {n:`آيَةَ الكُرْسِيِّ`, t:1, note:`ثُمَّ تَقْرَأُ آيَةَ الكُرْسِيِّ، وَتُهْدِي ثَوَابَهَا، لِأَمْوَاتِ المُسْلِمِينَ`},
 {n:`سُبْحانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ اسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ، عَمِلْتُ سُوءاً، وَظَلَمْتُ نَفْسِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ`, t:3, note:`ترددها`},
 {n:`التوسلات`, t:1, note:`نهاية الراتب و بداية التوسلات`},
 {n:`تَوَسُّلُ حَبْلِ الوِصَالِ بِأَسْمَاءِ اللَّهِ الحُسْنَى`, t:1, note:`يُقْرَأُ بَعْدَ الرَّاتِبِ، وَعِنْدَ الِاصْفِرَارِ، وَفِي السَّحَرِ`},
 {n:`شَرَعْتُ بِبَسْمِ اللَّهِ نَظْمَ ذَخِيرَتِي
بِحُجْرَةِ طَهَ قَدْ بَدَأْتُ وَسِيلَتِي

وَثَنَّيْتُ بِالحَمْدِ الجَمِيلِ لِخَالِقِي
واتَّبِعُهُ خَيْرَ الصَّلَاةِ بِهِمَّتِي

عَلَى أَحْمَدَ المَحْمُودِ وَالصَّحْبِ مَعْ آلٍ
وَيَقْرِنُهَا تَسْلِيمُ رَبِّي تَحِيَّتِي

وَبَعْدُ فَبِالأَسْمَاءِ أَسْمَاءِ رَبِّنَا
تَوَسَّلْتُ أَرْجُو مِنْهُ أَسْرَارَ حَضْرَةِ

فَيَا اللهُ أَمْدِدْنَا بِأَسْرَارِكَ العُظْمَى
وَيَا هُوَ أَفِضْ مِنْ نُورٍ سِرِّ الْهُوِيَّةِ

وَأَنْتَ أَيَا رَحَمْنَ عُمَّ بِرَحْمَةٍ
وَخُصَّ رَحِيمٌ مِنَّنَا لِلسُّوَيْدَةِ

وَيَا مَالِكَ مَلَكْ عُبَيْدَكَ نَفْسَهُ
وَخَلَّصْهُ يَا قُدُّوسُ مِنْ خُبْثِ حَالَةِ

سَلَامُ فَسَلِّمْنَا مِنْ الأَهْوَالِ كُلَّهَا
أَفِضْ مُؤْمِنٌ تَكْمِيلَ إِيمَانِنَا أَثْبِت

مُهَيْمِنُ أَكْلَا سِرَّنَا عَنْ سِوَاكَ صُنْ
عَزِيزُ تَوَلَّانَا بِعِزّ الحَضِيرَةِ

وَكُونَنْ أَيَا جَبَّارُ جَابِرٌ قُلُوبِنَا
وَكَمِّلْ أَيَا مُتَكَبِّرُ فَنِّي غَفْلَتِي

وَيَا خَالِقُ اجْعَلْ جَمِيعِي لِخِدْمَتِكَ
وَيَا بَارِئُ أَبْرِئُ مِنَ السُّقْمِ جُمْلَتِي

مُصَوِّرَنَا جَمِّلْ بِصُنْعِكَ صُورَتي
وَأَنْتَ أَيَا غَفَّارُ أَغْفِرْ لِزِلَّتِي

وَاقْهِرْ أَيَا قَهَّارُ أَعْدَايَ وَكَيْدَهُمْ
وَبِالوَهْبِ يَا وَهَّابُ هَبْ مِنْكِ بُغْيَتِي

وَوَسِّعْ لَنَا الْأَرْزَاقَ رَزَّاقُ دَائِماً
وَفَتَّاحُ افْتَحْ قُفْلَ قَلْبِي بِحِكْمَةِ

عَلِيمٌ فَعَلَّمْنَا عُلُومَ شَرِيعَةٍ
حَقِيقَةَ عِلْمٍ جَلَّ رَبِّي لِصُورَتِي

ويَا قَابِضُ اِقْبِضْ شَرَّ مَنْ رَامَ كَيْدَنَا
وَيَا بَاسِطُ ابْسُطْ رِزْقَ عَبْدٍ بِوُسْعَةِ

وَيَا خَافِضُ اخْفِضْ شَأْنَ مَنْ أَمَّ ذُلَّنَا
وَيَا رَافِعُ ارْفَعْنَا بِسِرِّ الْخِلَافَةِ

مُعِزَّ بِنُورِ العِزّ عِزَّ جَمِيعَنَا
مُذِلُّ فَهَبْنَا سَرَّ ذُلِّ لِحَضْرَةِ

سَمِيعٌ فَاسْمِعْنَا لَذِينَ خِطَابِكُمْ
بِصِيرٌ فَأَشْهِدْنَا تَجَلِّي النَّهَايَةِ

وَيَا حَكَمُ حَكَمْ عَلَيْنَا سَيِّدِي النَّبِيِّ
وَيَا عَدْلُ وَفَقْنَا لِعَدْلِ الرَّعِيَّةِ

لَطِيفُ تَوَلَّانَا بِلُطفِ مُؤَبَّدٍ
خَبِيرٌ أَفِدْ أَسْرَارَنَا عَلْمَ وَحْدَةِ

حَلِيمٌ فَهَبْنَا الحِلْمَ فِي كُلِّ لَحْظَةٍ
عَظِيمُ فَعَظَّمْنَا بِإِرْثِ النُّبُوَّةِ

غَفُورٌ عَنِ الأَسْوَاءِ فَاسْتُرْ عُيُوبَنَا
شَكُورُ فَهَبْنَا الشُّكْرَ فِي كُلِّ نِعْمَةِ

عَلِيَّ إِلَى أَعْلَى المَقَامَاتِ عَلَّنَا
كَبِيرٌ فَكَبِّرْ شَأْنَنَا بِإِسْتِقَامَةِ

حَفِيظٌ تَوَلَّ حِفْظَ كُلَّ بِمِنَّةٍ
مُقِيتُ أَمِدَّ السِّرَّ وَالجِسْمَ غُزْوَتِي

وَأَنْتَ الحَسِيبُ كُنْ إِلَهِي حَسِيبَنَا
وَفَخَّمْ جَلِيلٌ مِنَّنَا القَدْرَ وَأَثْبِتِ

تَفَضَّلْ عَلَيْنَا يَا كَرِيمُ بِسُؤْلِنَا
وَأَكْلَأْنَا أَنْتَ الرَّقِيبُ بِرَأْفَةِ

أَجِبْ لِدُعَانَا يَا مُجِيبُ بِسُرْعَةٍ
وَيَا وَاسِعٌ وَسَعْ لَنَا فَيْضَ رَحْمَةِ

حَكِيمٌ فَهَبْنَا مِنْكَ أَسْرَارَ حِكْمَةٍ
وَدُودُ تَوَلَّانَا بِعَيْنِ المَحَبَّةِ

مَجِيدٌ فَمَجِدْ سِرَّنَا بِفَنَائِهِ
وَيَا بَاعِثُ ابْعَثْنَا عَلَى خَيْرٍ حَالَةِ

شَهِيدٌ أَقِينَا شَرَّ نَفْسٍ وَغَيْرِهَا
وَيَا حَقُّ حَقَّقْنَا بِعِلْمِ اللَّدُنَّةِ

وَكِيلٌ فَثَبِّتْنَا بِتَوْكِيلِكَ الأَعْلَا
قَوِيٌّ فَقَوِّينَا عَلَى فِعْلِ طَاعَةِ

مَتِينُ فَشَدَّدْ حَبْلَ وَصْلِي دَائِماً
وَلِيُّ فَرَقِّينَا لِأَعْلَى الوِلَايَةِ

لِحَمْدِكَ وَفَقْنَا حَمِيدٌ بِهِمَّةٍ
وَيَا مُحْصِيُ احْفَظْ عَنِ الغَيْرِ مُضْغَتِي

وَيَا مُبْدِئُ أَبْدِي لَنَا عَنْ جَمَالِكُمْ
مُعِيدٌ أَعِدْنَا فِي الفَنَا فِي الحَضِيرَةِ

وَيَا مُحْيِي أَحْيِي سُوَيْدَانَا بِكُمْ
مُمِيتُ أُمِتْ نَفْسِي لِتَحْظَى بِبُغْيَتِي

وَيَا حَيُّ أَحْيِنَا بِكُمْ يَا إِلَهَنَا
وَقَيُومُ أَوْقِفْنَا بِعَيْنِ القَيُّومَةِ

وَيَا وَاجِدٌ اُمْنُنْ بِوَجْدٍ مُؤَبَّدٍ
وَيَا مَاجِدٌ مَجِدْ لِشَأْنِي بِذَوْقَةِ

وَيَا وَاحِدٌ وَحَدْ فُؤَادِي لِحُبِّكُمْ
وَيَا صَمَدٌ قَوَّ الْتِجَائِي لِرَكْزَتِي

وَيَا قَادِرُ ارْفَعْ لِعَجْزِي بِقُوَّةِ
وَمُقْتَدِرُ تَوِّجْ لِوَجْهِي بِهَيْبَةِ

مُقَدَّمُ قَدَّمَنِي لِأَعْلَى مَكَانَةٍ
مُؤَخِّرُ أَخَّرْ لِي عَنِ الخُبْثِ نِيَّتِي

وَيَا أَوَّلُ قَوَّ إِبْتِدَائِي لَحُبِّكُمْ
وَيَا آخِرُ حَسَّنْ رُجُوعِي لِأُخْرَتِي

وَيَا ظَاهِرُ اظْهِرْ عَلَيَّ سَنَاءَكُمْ
وَيَا بَاطِنُ أَبْطِنْ فِي فُؤَادِي الهِدَايَةِ

وَيَا وَالِيُّ أَمْرِي بِرِفْقٍ تَوَلَّهُ
وَيَا مُتَعَالٍ أَعْلِ قَدْرِي وَحُرْمَتِي

وَيَا بَرُّ كُنْ بَرَّاً بِنَا فِي أُمُورِنَا
وَتَوَّابُ امْنَحْ تَوْبَةً لِي بِسُرْعَةِ

وَمُنْتَقِمُ خُذْ لِي بِثَأْرِي مِنْ العِدَا
عَفُو عَنِ الزَّلَّاتِ فَأَعْفُ بِرَأْفَةٍ

رَءُوفٌ تَرَأَفْ فِي أُمُورِي جَمِيعِهَا
وَيَا مَالِكَ الْمُلْكِ امْنَحِ العَبْدَ نَفْحَةِ

وَيَا ذَا الجَلَالِ ثُمَّ الإِكْرَامِ عِزْنَا
وَمُقْسِطُ وَفَقْنَا لِمِيزَانِ شِرْعَةِ

وَيَا جَامِعُ اجْمَعْنَا دَوَاماً لِحَضْرَتِكَ
غَنِي فَجُدْ لِي بِالغِنَى وَالمَبَرَّةِ

وَيَا مُغْنِي امْلَأُ القُلُوبَ قَنَاعَةً
وَيَا مُعْطِي اعْطِ مِنَ الوَهْبِ حَاجَتِي

وَيَا مَانِعُ امْنَعْ كُلَّ سُوءٍ يَؤُمُّنَا
وَيَا ضَارُّ مَنْ يَنْوِي لِضُرِّي لَهُ اسْحَتِ

وَيَا نَافِعُ انْفَعْنِي بِأَهْلِي وَحَالَتِي
وَيَا نُورُ نَوِّرْ لِي طَرِيقِي بِوُضْحَةِ

وَيَا هَادِي أَهْدِي إِلَى الحَقِّ قَلْبَنَا
بَدِيعُ بِكُلِّ اللَّمْحِ أَبْدِعْ لِتَوْبَةِ

وَيَا بَاقِي ابْقِ العُبَيْدَ بِكُمْ لَكُمْ
وَيَا وَارِثُ وَفِّرْ مِنَ العِلْمِ إِرْثَتِي

رَشِيدُ لِفِعْلِ الرُّشْدِ وَفَقْ عُبَيْدَكُمْ
صَبُورٌ فَخَلَّقْنَا بِصَبْرِ الأَحِبَّةِ

سَأَلْتُكَ مَوْلَانَا بِالأَسْمَاءِ كُلَّهَا
وَأَسْرَارِهَا تُعْطِ الجَمِيعَ هِدَايَةِ

وَتَمْنَحُنَا حُسْنَ اليَقِينِ وَتَوْبَةً
وَتُصْحِبُنَا تَأْدِيبَ حَقَّ النُّبُوَّةِ

وَتُجْلِي لَنَا أَسْرَارَ حَضْرَةِ ذَاتِكُمْ
تُخَلِّقُنَا بِصِفَاتِكُمْ يَا مُثَبِّتِ

وَتَمْنَحُنَا حُسَنَ الفَنَاءِ فِي نَبِيِّنَا
وَتُبْقِينَا فِيهِ بِهِ بِعِنَايَةِ

وَتُولِي لَنَا عَالِي شُهُودِ جَمَالِكُمْ
وَآدَابِ حَضْرَاتٍ لَدَيْكَ تَجَلَّتِ

تُوَسَّعْ لَنَا الْأَرْزَاقَ حِسَّا وَبَاطِناً
تُبَارِكُ أَوْلَادِي وَصَحْيِي وَزَوْجَتِي

تخص مُحَمَّداً عَبْدَ اللَّهِ جَعْفَراً
حَسَنُ وَأَوْلَادِي وَكُلَّ عَشِيرَتِي

وَتَمْنَحُ إِبْرَاهِيمَ أَيْضاً وَهَاشِماً
عَلِيّاً وَأَصْحَابِي وَكُلَّ خَلِيفَتِي

تَعُمُّ نَقِيباً صَالِحاً صَادِقاً عَرَبِي
وَيَعْقُوبَ حَمَّاداً وَأَهْلَ طَرِيقَتِي

وَصَلِّ بِقَدْرِ الذَّاتِ مَا الخَتْمُ قَدْ جَلَا
عَلَى أَحْمَدٍ وَالصَّحْبِ وَالآلِ ذُخْرَتِي`, t:1, note:``},
 {n:`سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ اسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ، عَمِلْتُ سُوءاً، وَظَلَمْتُ نَفْسِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ`, t:3, note:``},
 {n:`تَوَسُّلُ تَرَاكُمِ الأَنْوَارِ بِأَسْمَاءِ الرِّجَالِ`, t:1, note:`يُقْرَأُ بَعْدَ الرَّاتِبِ، وَعِنْدَ الِاصْفِرَارِ`},
 {n:`نَسْأَلُكَ بِالصَّفَاتِ ثُمَّ الذَّاتِ
بِأَسْمَائِكَ العُلْيَا وَبِالْآيَاتِ

بِأَفْعَالِكَ العُظْمَى أَيَا مَوْلَانَا
بِالكِبْرِيَاءِ ثُمَّ بِالعَظَمَـات

بِسِر تَجَلِّي الكُنْهِ يَا كَرِيمُ
بِغَيْبِ غَيْبِ الغَيْبِ بِالثَّقَاتِ

بالنُّورِ بِالحِجَابِ بِالأَبْوَابِ
بِقَابِ قَوْسَيْنِ بِطَلْسَمَاتِ

بِالعَرْشِ وَالكُرْسِيِّ يَا إِلَهِي
بِالقَلَمِ الأَعْلَى بِمَطْوِيَّاتِ

بِاللَّوْحِ ثُمَّ النُّونِ ثُمَّ الصَّرْفِ
بِالسَّدْرَةِ العُلْيَا وَبِالرَّحْمَاتِ

بِعِلْمِكَ المَكْنُونِ يَا عَظِيمُ
بِسِرِّكَ المَصُونِ بِالهِبَاتِ

بِالمُسْتَوَى الأَزْهَى بِمَا لَدَيْهِ
بِالسِّتْرِ الأَبْهَى ثُمَّ بِالرُّعَاةِ

بِبَيْتِكَ المَعْمُورِ بِالسَّمَاءِ
بِالْأَرَضِينَ يَا وَلِي هِبَاتِ

بِالمَلَكِ النَّافِخِ فِي ذِي الصُّورِ
أَعْنِي بِإِسْرَافِيلَ ذِي الحَيَّاتِ

بِمُقَسِّمِ الأَرْزَاقِ مِيكَائِيلَ
أَيْضاً وَجِبْرِيلَ وَذِي المَمَاتِ

بِسَائِرِ الأَمْلَاكِ يَا عَلِيمُ
بِبَيْتِ خَلْوَةِ الكَمَالِ الذَّاتِي

بِكَنْزِكَ الجَلِيلِ مُصْطَفَانَا
وَمَظْهَرِ الأَنْوَارِ وَالسُّبْحَاتِ

بِمُلْكٍ وَمِلْكِهِ يَا رَبِّ
بِأَسْمَائِهِ العُلْيَا وَبِالصَّفَاتِ

بِمُلْكٍ وَمِلْكِهِ يَا رَبِّ
بِأَسْمَائِهِ العُلْيَا وَبِالصَّفَاتِ

بِذَاتِهِ الَّتِي تَعَالَتْ قِدَماً
بِمَا انْطَوَتْ عَلَيْهِ مِنْ صِلَاتِ

وَبِالخَلِيلِ الأَعْظَمِ الجَلِيلِ
وَبِالكَلِيمِ مَنْ لَهُ السَّمَاتِ

بالرُّوحِ ثُمَّ الرَّوْحِ يَا حَكِيمُ
بِآدَمِ مَعْ نُوحٍ ثُمَّ الْآتِ

بِزَكَرِيَّا ثُمَّ دَاوُدَ السَّنِي
بِمَنْ لَهُ الرِّيَاحُ سُخِرَاتِ

بِالأَنْبِيَا وَالرُّسُلِ أَجْمَعِينَا
بِالصَّحْبِ أَهْلِ الجَدِّ وَالعَزَمَاتِ

بِكَلِمَاتِكَ الَّتِي تَجَلَّتْ
بِسَيِّدِي الصَّدِيقِ ذِي الحَالَاتِ

كَذَاكَ بِالفَارُوقِ مَنْ تَحَلَّى
بِالفَرْقِ بِالشَّهِيدِ بِالصَّلَاتِ

بِابْنِ عَمَّ المُصْطَفَى عَلَيَّ
بِالحَسَنِ الجَلِيلِ بِالزَّوْرَاتِ

وَبِالحُسَيْنِ وَأُمَّهِ الزَّهْرَاءِ
بِسَائِرِ الأَوْلَادِ وَالزَّوْجَاتِ

بِالحَبْرِ وَالعَمَّيْنِ يَا مُغِيتُ
بِعَمْرِ الأَخِيرِ بِالخَيْرَاتِ

بِمَالِكِ نُعْمَانِنَا وَالشَّافِعِي
وَالحَنْبَلِي أُوَيْسِنَا هُدَاةِ

بِابْنِ ابْنِ سَيِّدِي مُعَاوِيَة
كَذَاكَ بِالمُتَوَكَّلِ الرُّعَاةِ

كَذَا بِمُحِبِي الدِّينِ بِالجُنَيْدِ
بِالجِيلِي بِالكَيْلَانِي ذِي الشَّطَحَاتِ

بالشَّبْلِي وَالسَّرِيِّ ثُمَّ المَغْرَبِي
بِبِشْرِ بِالحَلاجِ بِالسَّكَرَاتِ

بِسَيِّدِي طَيْفُورِ بِالخَوَاصِ
بِابْنِ أَدْهَمَ زَاهِدِ الدُّنْيَاتِ

بِابْنِ مَشِيشِ كَذَاكَ الشَّاذِلِي
بِالمُرْسِي وَابْنِ عَطَاءِ ذِي الحِكْمَاتِ

بالعَرْشِ وَالسُّلَّمْ عَطَا مَوْلَانَا
كَذَا بِمَعْرُوفٍ أَبِي الفُرَاتِ

بالمِصْرِي ذِي النُّونِ الَّذِي تَمَلَّى
بِابْنِ عَبَّادٍ مَعَ النِّسْوَاتِ

بالسَّخْتِيَانِي ثُمَّ بِالكِرْمَانِي
بِالغَوْثِ أَبِي مَدْيَنَ بِالرُّوَاةِ

كذاك بِالحَدَّادِ بِالنَّسَّاجِ
بِابْنِ جَمْرَةَ مُذْهِبِ الشَّقْوَاتِ

بِسَيِّدِي حَمْدُونَ بِالدُّسُوقِي
بِالبَدَوِي وَارِثِ الحَالَاتِ

بِالعَيْدَرُوسِ وَالفَقِي المُقَدَّمِ
بِسَيِّدِي مُوسَى بِتَرْجَمَاتِ

بِابْنِ سَوْدَكِينِ وَالحِفْنِي
وَالقَوْنَوِيِّ خَالِصِ النَّيَّاتِ

بدْرِ الَّذِي لَهُ مَقَامُ
بِهِ جَلَى مِنْ كُلِّ هَمَّ آتِ

بِالقُطْبِ عَبْدِ اللَّهِ الحَدَّادِ
بِالبَازِ بِالسَّقَافِ بِالحَوَّاتِ

بِسَيِّدِي المَحْجُوبِ بِالنَّهَارِي
بِنَائِبِ المُخْتَارِ فِي الْأَوْقَاتِ

بِالنَّخْشَيِّ الفَاضِلِ التَّبْرِيزِي
بِالبَكْرِيِّ بِالوَفَاءِ بِالغَيْبَاتِ

بِالطَّمْسِ بِالصَّحْوِ وَمَحْوِ المَحْوِ
بِالسَّحْقِ بِالمَحْقِ وَبِالنَّفَحَاتِ

بالمِيْر غَنِي الغَوْثِ عَبْدِ اللَّهِ
بِالكُرْدِي وَالدَّمِشْقِي وَالوُلَاةِ

بالجَدٌ جَعْفَر مِيرَكَ المَكَّيِّ
بِالأَهْدَلِي النَّاصِرِ الدَّعَوَاتِ

بِشَيْخِنَا ابْنِ إِدْرِيسَ بِالتَّازِي
بِالخَضْرِ وَالدَّبَّاغِ هُمْ سَادَاتِي

بالقطب تَاجِ الخَتْمِ إِبْرَاهِيمَ
وَصِنْوِهِ المَحْجُوبِ بَابِ هِبَاتِ

بِمُفْرَدِ الأَقْطَابِ سَرِّ الخَتْمِ
بِجَعْفَرِ النُّورِ بَهِي الذَّاتِ

بِسَيِّدِي الحَسَنِ عَظِيمِ السِّرِّ
وَابْنَيْهِ عُثْمَانَ وَأَحْمَدَ فَاتِ

بِالفَرْدِ إِبْرَاهِيمَ نَجْلَ خَتْمِنَا
وَنَجْلِ سَرِّ السِّرِّ ذِي النَّجْدَاتِ

بِسَيِّدِي عُثْمَانَ تَاجِ السِّرِّ
وَسَيِّدِي البَكْرِي ذِي البَرَكَاتِ

بِسَيِّدِي هَاشِمْ عَظِيمِ الشَّأْنِ
وَسَيِّدِي المَحْجُوبِ ذِي النَّفَحَاتِ

بِسَيِّدَيْ إِبْرَاهِيمَ سَرِّ الخَتْمِ
اصْلِحْ لَنَا الْأَحْوَالَ وَالنَّيَّاتِ

بالحَبْرِ ذِي الأَسْرَارِ وَالعُلُومِ
القُطْبِ سَرِّ الخَتْمِ ذِي الهِبَاتِ

بِغَوْثِنَا وَالوُزَرَاء الأَئِمَّة
بِالأَجْلِيَاءِ الأَوْتَادِ وَالسَّادَاتِ

كَذَاكَ بِالأَبْدَالِ يَا حَلِيمُ
وَالبُدَلَاء وَالنَّجَبَاءِ قَادَاتِ

والنقباء مَعْ سَقِيطِ الرَّفْرَفِ
كَذَا رِجَالُ الفَتْحِ وَالسَّاعَاتِ

وَالرَّجَبِيُّونَ الَّذِينَ تَعَلَّوْا
ثُمَّ رِجَالُ النَّصْرِ وَالأَوْقَاتِ

بِعَالَمِ السِّمْسِمِ بِالسَّمَانِي
وَبِالعَمَاءِ ثُمَّ بِالْجِهَاتِ

بِسَائِرِ الأَكْوَانِ يَا مَوْلَانَا
عُلْوِتِهَا سُفْلِيهَا وَالْآتِ

بِالمَهْدِي مَنْ بَشِّرْ بِهِ الْمُخْتَارُ

function parseVersePairs(text){
  return text.split(/\n\s*\n/).map(b => b.split('\n').filter(Boolean)).filter(b => b.length);
}
function stripHarakat(s){
  return s.normalize('NFC').replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g, '');
}
function findRatibText(startsWith){
  const needle = stripHarakat(startsWith);
  const step = RATIB_STEPS.find(s => stripHarakat(s.text).startsWith(needle));
  return step ? step.text : '';
}

أَذِلَّهُمْ مَمَاتَهُمْ وَالمَحْيَا

أَنْزِلْ بِهِمْ مُصِيبَةً لَا تُبْطِي
وَمِحْنَةً سِهَامُهَا لَا تُخْطِي

وَاحْرِمْهُمْ رِضَاكَ فِي الدَّارَيْنِ
بِجَاهِ طه سَيِّدِ الكَوْنَيْنِ

حَبِيبِكَ الشَّفِيعِ فِي القِيَامَة
عَلَيْهِ صَلِّ أَبَدَ الدَّوَامَة

مُسَلِّماً وَآلِهِ وَصَحْبِهِ
وَتَابِعِ الختْمِ وَكُلِّ حِزْبِهِ

وَعُمَّ آلَ المِيرْغَنِي بِالمَغْفِرَة
فِي هَذِهِ الدَّارِ وَدَارِ الآخِرَة

فِي هَذِهِ الدَّارِ وَدَارِ الآخِرَة
وَارْزُقْهُمُ التَّقْوَى بِخَتْمِ الأَنْبِيَاءِ

وَامْنَحْهُمُ فَهْمَ الكِتَابِ وَالسُّنَّة
وَاهْدِهِمُ الصِّرَاطَ يَا ذَا المِنَّة

وَخُصَّ مِنْ نَسْلِ الختَامِ قَائِماً
يَقُومُ بِالشَّرْعِ الحَنِيفِ دَائِماً

    getText: () => `أَسْتَغْفِرُ اللَّهَ بَلْ فِي الكُتُبِ مَرْوِيَّاً\nأَسْتَغْفِرُ اللَّهَ لَيْسَ الأَمْرُ مُخْفِيَاً\nأَسْتَغْفِرُ اللَّهَ وَعْدَ اللَّهِ مَأْتِيَّاً\nأَسْتَغْفِرُ اللَّهَ بَلْ فِي العَيْنِ مَرْئِيَّاً\nوَلَا مُحِيصَ لَنَا مِمَّا جَنَيْنَاهُ

أَسْتَغْفِرُ اللَّهَ مِمَّا كُتِبَ فِي الحُقُبِ\nأَسْتَغْفِرُ اللَّهَ قَدْ قَصَّرْتُ فِي الطَّلَبِ\nأَسْتَغْفِرُ اللَّهَ لِي فِي أَعْظَمِ السَّبَبِ\nأَسْتَغْفِرُ اللَّهَ وَلَّى العُمْرُ فِي اللَّعِبِ\nعَلَى صَعِيدٍ بِأَرْضِ اللَّهِ وَيْلَاهُ

أَسْتَغْفِرُ اللَّهَ كَمْ مِنْ نِعْمَةٍ عُرِفَتْ\nأَسْتَغْفِرُ اللَّهَ كَمْ مِنْ نِعْمَةٍ سَلَفَتْ\nأَسْتَغْفِرُ اللَّهَ كَمْ مِنْ ذَلَّةٍ غُفِرَتْ\nأَسْتَغْفِرُ اللَّهَ كَمْ مِنْ شِدَّةٍ صُرِفَتْ\nفَلَيْسَ لَنَا مِنْهُ مَلْجَأٌ إِلَّا بِرُحْمَاهُ

أَسْتَغْفِرُ اللَّهَ كَمْ مِنْ حَالِفٍ حَنَثَا\nأَسْتَغْفِرُ اللَّهَ كَمْ عَهْدٌ لَهُ نُكِثَا\nأَسْتَغْفِرُ اللَّهَ مَنْ بِالحَقِّ قَدْ بَعَثَا\nأَسْتَغْفِرُ اللَّهَ كَمْ مِنْ حَالِفٍ حَنَثَا\nهِدَايَةً مَنْ زَرَفَتْ بِالدَّمْعِ عَيْنَاهُ

أَسْتَغْفِرُ اللَّهَ مِنْ جُرْمِي وَمِنْ عِوَجِي\nأَسْتَغْفِرُ اللَّهَ مِنْ جَهْلِي وَمِنْ لَجَجِي\nأَسْتَغْفِرُ اللَّهَ مِنْ غَيْظِي وَمِنْ حَرَجِي\nأَسْتَغْفِرُ اللَّهَ مِنْ فِعْلٍ لَنَا سَمِجٍ\nمَعَنَا وَأَوْبَقَنَا لِمَا أَتَيْنَاهُ

أَسْتَغْفِرُ اللَّهَ مِنْ ذَنْبٍ قَدِ اتَّضَحَا\nأَسْتَغْفِرُ اللَّهَ كَمْ مِنْ نَاصِحٍ نَصَحَا\nأَسْتَغْفِرُ اللَّهَ أَعْلَا الذَّنْبِ قَدْ نَصَحَا\nأَسْتَغْفِرُ اللَّهَ كَمْ طَرْفٍ لَنَا طَمَحَا\nفَجَعَلَ لِمَقْصَدِنَا لَمَّا سَلَكْنَاهُ

أَسْتَغْفِرُ اللَّهَ مَهْمَا شَامِخٌ شَمَخَا\nأَسْتَغْفِرُ اللَّهَ مَا هَبَّ النَّسِيمُ رَخَا\nأَسْتَغْفِرُ اللَّهَ مِنْ ذَنْبٍ قَدِ اتَّسَخَا\nأَسْتَغْفِرُ اللَّهَ مَنْ بِالعَفْوِ قَدْ رَسَخَا\nشُكْراً لِمَنْ قَدْ رَأَى ذَنْباً فَأَمْحَاهُ

أَسْتَغْفِرُ اللَّهَ لَا أُحْصِيهِ بِالعَدَدِ\nأَسْتَغْفِرُ اللَّهَ مِنْ ذَنْبٍ آخِرَ الأَبَدِ\nأَسْتَغْفِرُ اللَّهَ مِمَّا لَاحَ فِي خَلَدِي\nأَسْتَغْفِرُ اللَّهَ مَا يُبْقِي الرَّدَى جَسَدِي\nفَكَيْفَ أَغْفَلُ عَنْ مَنْ لَيْسَ يَنْسَاهُ

أَسْتَغْفِرُ اللَّهَ ذَابَ القَلْبُ فِي الطَّمَعِ\nأَسْتَغْفِرُ اللَّهَ فَاتَ العُمْرُ فِي الجَذَعِ\nأَسْتَغْفِرُ اللَّهَ جَاءَ الحَقُّ وَاعِ يَعِ\nأَسْتَغْفِرُ اللَّهَ نَعْي الهَالِكُونَ نَعِ\nيَا وَيْحَ مَنْ بَاعَ أُخْرَاهُ بِدُنْيَاهُ

أَسْتَغْفِرُ اللَّهَ مَا إِبْلِيسُ قَدْ نَزَغَا\nأَسْتَغْفِرُ اللَّهَ مَا بَدْرُ الدُّجَا بَزَغَا\nأَسْتَغْفِرُ اللَّهَ مَا هَذَا الحَدُّ قَدْ بَلَغَا\nأَسْتَغْفِرُ اللَّهَ مَا شَخْصٌ طَغَى وَبَغَى\nمُحَمَّداً وَاصْطَفَاهُ ثُمَّ أَرْضَاهُ

أَسْتَغْفِرُ اللَّهَ قَدْ أَصْبَحْتُ أَعْتَرِفُ\nأَسْتَغْفِرُ اللَّهَ مِمَّا كُنْتُ أَغْتَرِفُ\nأَسْتَغْفِرُ اللَّهَ مَا بَيْنَ الوَرَى أَقِفُ\nأَسْتَغْفِرُ اللَّهَ أَعْلَا الذَّنْبِ مُنْعَرِفُ\nعَلَى صَعِيدٍ بِأَرْضِ اللَّهِ وَيْلَاهُ

أَسْتَغْفِرُ اللَّهَ مِمَّا كُنْتُ فِي عَلَقِ\nأَسْتَغْفِرُ اللَّهَ مِنْ وَجْدِي وَمِنْ حَرَقِي\nأَسْتَغْفِرُ اللَّهَ فَاضَ الدَّمْعُ فِي الحَدَقِ\nأَسْتَغْفِرُ اللَّهَ قَدْ أَصْبَحْتُ فِي قَلَقِي\nعَنِ الجَمِيلِ الَّذِي خَالَفْتُ أَمْرَاهُ

أَسْتَغْفِرُ اللَّهَ مُخْفِي الشَّمْسِ فِي الحَلَكِ\nأَسْتَغْفِرُ اللَّهَ مُجْرِي الشَّمْسِ فِي الفَلَكِ\nأَسْتَغْفِرُ اللَّهَ مِنْ جُهْلٍ وَمِنْ نُسُكِ\nأَسْتَغْفِرُ اللَّهَ مُبْدِي الصُّبْحِ فِي الحُبُكِ\nفَكَيْفَ يَنْسَى عَبْدُ السُّوءِ مَوْلَاهُ

أَسْتَغْفِرُ اللَّهَ مِنْ عَجْزِي وَمَنْ كَسَلِي\nأَسْتَغْفِرُ اللَّهَ مِنْ ذَنْبِي وَمِنْ زَلَلِي\nأَسْتَغْفِرُ اللَّهَ مَهْمَا عِشْتُ فِي مَهَلِي\nأَسْتَغْفِرُ اللَّهَ مَا ضَيَّعْتُ مِنْ عَمَلِي\nوَفِي نَعِيمٍ وَذَلِ كَيْفَ أَنْسَاهُ

أَسْتَغْفِرُ اللَّهَ ذَا الإِفْضَالِ وَالكَرَمِ\nأَسْتَغْفِرُ اللَّهَ ذَا الآلَاءِ وَالنِّعَمِ\nأَسْتَغْفِرُ اللَّهَ بَارِئْ قَطْرَةِ النَّسَمِ\nأَسْتَغْفِرُ اللَّهَ ذَا التَّوْفِيقِ وَالعِصَمِ\nوَرَاحِمِ المَيِّتِ مِنَّا إِذْ تَوَفَّاهُ

أَسْتَغْفِرُ اللهَ مَنْ بِالرِّزْقِ أَحْيَانَا\nأَسْتَغْفِرُ اللهَ مَنْ بِاللُّطْفِ أَنْشَأَنَا\nأَسْتَغْفِرُ اللهَ مِمَّا فِي الصِّبَا كَانَا\nأَسْتَغْفِرُ اللهَ إِنْ أَبْلَا أَوْ أَنْجَانَا\nوَا حَسْرَتَا غَدًا مِمَّا جَنَيْنَاهُ

أَسْتَغْفِرُ اللهَ مِمَّا كُنْتُ آتِيهِ\nأَسْتَغْفِرُ اللهَ مِمَّا كُنْتُ أُبْدِيهِ\nأَسْتَغْفِرُ اللهَ مِمَّا كُنْتُ أَجْنِيهِ\nأَسْتَغْفِرُ اللهَ مِمَّا كُنْتُ أُخْفِيهِ\nفَكَيْفَ أَنْسَى اجْتِرَامِي وَاحْصَاهُ

أَسْتَغْفِرُ اللهَ كَمْ مِنْ كَافِرٍ حَنَذَا\nأَسْتَغْفِرُ اللهَ كَمْ مِنْ مُذْنِبٍ نَفَذَا\nأَسْتَغْفِرُ اللهَ كَمْ قَالَ الْمُسِيءُ إِذَا دَعَاهُ\nأَسْتَغْفِرُ اللهَ مَا أَحْصَاهُ قَدْ نَفَذَا\nمَنْ لِي سِوَاكَ الْيَوْمَ لَبَّاهُ

أَسْتَغْفِرُ اللهَ مُبْدِئَ صُورَةِ البَشَرِ\nأَسْتَغْفِرُ اللهَ مَحَى الأَرْضَ بِالْمَطَرِ\nأَسْتَغْفِرُ اللهَ بِالتَّخْيِيمِ وَالسَّفَرِ\nأَسْتَغْفِرُ اللهَ بِالآصَالِ وَالبُكَرِ\nوَحَيْثُ مَا كُنْتُ أَرْجُوهُ وَأَخْشَاهُ

أَسْتَغْفِرُ اللهَ عَنْ شُكْرٍ يَكُونُ جَزَا\nأَسْتَغْفِرُ اللهَ كُلُّ الخَلْقِ قَدْ عَجَزَا\nأَسْتَغْفِرُ اللهَ مَنْ بِالعَفْوِ قَدْ حَجَزَا\nأَسْتَغْفِرُ اللهَ هَذَا الوَعْدُ قَدْ نُجِزَا\nعَنِ الجَحِيمِ وَلَاقَاهُ مَا تَمَنَّاهُ

أَسْتَغْفِرُ اللهَ لِلأَنْوَارِ أَقْتَبِسُ\nأَسْتَغْفِرُ اللهَ بِالأَسْحَارِ أَخْتَلِسُ\nأَسْتَغْفِرُ اللهَ هَذَا الجِسْمُ قَدْ بَخِسَ\nأَسْتَغْفِرُ اللهَ عَفْوَ اللهِ أَلْتَمِسُ\nعَسَاهُ يَرْحَمُ مَنْ بِالذُّلِّ نَاجَاهُ

أَسْتَغْفِرُ اللهَ مَا قَدَّمْتُهُ نَقَشَا\nأَسْتَغْفِرُ اللهَ وَلَّى العُمْرُ حَيْثُ فَشَا\nأَسْتَغْفِرُ اللهَ مَا يَبْقِي عُشُوبُ رَشَا\nأَسْتَغْفِرُ اللهَ مَا أَجْرَمْتُهُ فُرُشَا\nوَلَا يَرُدُّ الرَّدَى إِلَّا مَا وَهَبْنَاهُ

أَسْتَغْفِرُ اللهَ مَهْمَا نَاكِصٌ نَكَصَا\nأَسْتَغْفِرُ اللهَ مَهْمَا نَاقِصٌ نَقَصَا\nأَسْتَغْفِرُ اللهَ مَهْمَا خَالِصٌ خَلَصَا\nأَسْتَغْفِرُ اللهَ مَهْمَا العُمْرُ قَدْ نَقَصَا\nمِمَّا جَنَيْنَاهُ وَالفِرْدَوْسِ سُكْنَاهُ

أَسْتَغْفِرُ اللهَ رَيْعَانَ الشَّبَابِ مَضَى\nأَسْتَغْفِرُ اللهَ جُلَّ العُمْرِ انْقَرَضَا\nأَسْتَغْفِرُ اللهَ مَنْ بِالْمَمَاتِ قَضَى\nأَسْتَغْفِرُ اللهَ جَاءَ الحَتْفُ مُعْتَرِضَا\nوَلَا مَفَرَّ لَنَا مِمَّا قَضَى اللهُ

 {n:`الحَمْدُ للهِ العَظِيمِ، وَالشُّكْرُ اللهِ القَدِيمِ، بِعَدَدِ كُلِّ ذَرَّةٍ مِنْ مَخْلُوقَاتِكَ لَكَ بِهِ، كَمَا يَلِيقُ بِكُنْهِكَ، يَتَضَاعَفَانِ بِحَسَبِ اللَّمَحَاتِ، وَيَتَجَدَّدَانِ فِي سَائِرِ اللَّحَظَاتِ، وَيَدُومَانِ فِي سَائِرِ الأَوْقَاتِ، وَيَبْقَيَانِ بِبَقَاءِ الذَّاتِ، وَيُحِيطَانِ بِجَمِيعِ الحَمْدِيَّاتِ وَالشُّكْرِيَّاتِ، فَيَصِحُ ثَوَابُهُمَا وَيَتَكَرَّرُ ذَلِكَ إِلَى مَا لَا يَحْصُرُهُ هَالِكُ، وَصَلَّى اللَّهُ عَلَى سَيِّدِنَا مُحَمَّدٍ، وَعَلَى آلِهِ وَصَحْبِهِ، ذَوِي الْأَسْرَارِ مِثْلَ ذَلِكَ`, t:3, note:`ثم تقول`},
 {n:`أَسْتَغْفِرُ اللهَ العَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ، الحَيَّ القَيُّومَ، غَفَّار الذُّنُوبِ ذَا الجَلَالِ وَالإِكْرَامِ، وَأَتُوبُ إِلَيْهُ مِنْ جَمِيعِ المَعَاصِي كُلَّهَا، وَالذُّنُوبِ وَالآثَامِ، وَمِنْ كُلِّ ذَنْبٍ أَذْنَبْتُهُ عَمْداً وَخَطَأً، ظَاهِراً وَبَاطِناً قَوْلاً وَفِعْلاً، فِي جَمِيعِ حَرَكَاتِي وَسَكَنَاتِي وَأَنْفَاسِي كُلُّهَا دَائِماً أَبَداً سَرْمَداً، مِنْ الذَّنْبِ الَّذِي أَعْلَمُ، وَمِنْ الذَّنْبِ الَّذِي لَا أَعْلَمُ، عَدَدَ مَا أَحَاطَ بِهِ العِلْمُ وَأَحْصَاهُ الكِتَابُ، وَخَطَهُ القَلَمُ، وَعَدَدَ مَا أَوْجَدَتْهُ القُدْرَةُ، وَخَصَّصَتْهُ الإِرَادَةُ، وَمِدَادَ كَلِمَاتِ اللَّهِ، وَكَمَا يَنْبَغِي لِجَلَالِ وَجْهِ رَبَّنَا وَجَمَالِهِ وَكَمَالِهِ، وَكَمَا يُحِبُّ رَبُّنَا وَيَرْضَى`, t:3, note:`ثم الاستغفار الكبير`},

 {n:`أَسْتَغْفِرُ اللهَ العَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ، الحَيَّ القَيُّومَ، غَفَّار الذُّنُوبِ ذَا الجَلَالِ وَالإِكْرَامِ، وَأَتُوبُ إِلَيْهُ مِنْ جَمِيعِ المَعَاصِي كُلَّهَا، وَالذُّنُوبِ وَالآثَامِ، وَمِنْ كُلِّ ذَنْبٍ أَذْنَبْتُهُ عَمْداً وَخَطَأً، ظَاهِراً وَبَاطِناً قَوْلاً وَفِعْلاً، فِي جَمِيعِ حَرَكَاتِي وَسَكَنَاتِي وَأَنْفَاسِي كُلُّهَا دَائِماً أَبَداً سَرْمَداً، مِنْ الذَّنْبِ الَّذِي أَعْلَمُ، وَمِنْ الذَّنْبِ الَّذِي لَا أَعْلَمُ، عَدَدَ مَا أَحَاطَ بِهِ العِلْمُ وَأَحْصَاهُ الكِتَابُ، وَخَطَهُ القَلَمُ، وَعَدَدَ مَا أَوْجَدَتْهُ القُدْرَةُ، وَخَصَّصَتْهُ الإِرَادَةُ، وَمِدَادَ كَلِمَاتِ اللَّهِ، وَكَمَا يَنْبَغِي لِجَلَالِ وَجْهِ رَبَّنَا وَجَمَالِهِ وَكَمَالِهِ، وَكَمَا يُحِبُّ رَبُّنَا وَيَرْضَى`, t:3, note:`الاستغفار الكبير`},

 {n:`وَٱلْقُرْءَانِ ٱلْحَكِيمِ ۝٢ إِنَّكَ لَمِنَ ٱلْمُرْسَلِينَ ۝٣ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ ۝٤ تَنزِيلَ ٱلْعَزِيزِ ٱلرَّحِيمِ ۝٥ لِتُنذِرَ قَوْمًۭا مَّآ أُنذِرَ ءَابَآؤُهُمْ فَهُمْ غَـٰفِلُونَ ۝٦ لَقَدْ حَقَّ ٱلْقَوْلُ عَلَىٰٓ أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ ۝٧ إِنَّا جَعَلْنَا فِىٓ أَعْنَـٰقِهِمْ أَغْلَـٰلًۭا فَهِىَ إِلَى ٱلْأَذْقَانِ فَهُم مُّقْمَحُونَ ۝٨ وَجَعَلْنَا مِنۢ بَيْنِ أَيْدِيهِمْ سَدًّۭا وَمِنْ خَلْفِهِمْ سَدًّۭا فَأَغْشَيْنَـٰهُمْ فَهُمْ لَا يُبْصِرُونَ ۝٩ وَسَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ ۝١٠ إِنَّمَا تُنذِرُ مَنِ ٱتَّبَعَ ٱلذِّكْرَ وَخَشِىَ ٱلرَّحْمَـٰنَ بِٱلْغَيْبِ ۖ فَبَشِّرْهُ بِمَغْفِرَةٍۢ وَأَجْرٍۢ كَرِيمٍ ۝١١ إِنَّا نَحْنُ نُحْىِ ٱلْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا۟ وَءَاثَـٰرَهُمْ ۚ وَكُلَّ شَىْءٍ أَحْصَيْنَـٰهُ فِىٓ إِمَامٍۢ مُّبِينٍۢ ۝١٢ وَٱضْرِبْ لَهُم مَّثَلًا أَصْحَـٰبَ ٱلْقَرْيَةِ إِذْ جَآءَهَا ٱلْمُرْسَلُونَ ۝١٣ إِذْ أَرْسَلْنَآ إِلَيْهِمُ ٱثْنَيْنِ فَكَذَّبُوهُمَا فَعَزَّزْنَا بِثَالِثٍۢ فَقَالُوٓا۟ إِنَّآ إِلَيْكُم مُّرْسَلُونَ ۝١٤ قَالُوا۟ مَآ أَنتُمْ إِلَّا بَشَرٌۭ مِّثْلُنَا وَمَآ أَنزَلَ ٱلرَّحْمَـٰنُ مِن شَىْءٍ إِنْ أَنتُمْ إِلَّا تَكْذِبُونَ ۝١٥ قَالُوا۟ رَبُّنَا يَعْلَمُ إِنَّآ إِلَيْكُمْ لَمُرْسَلُونَ ۝١٦ وَمَا عَلَيْنَآ إِلَّا ٱلْبَلَـٰغُ ٱلْمُبِينُ ۝١٧ قَالُوٓا۟ إِنَّا تَطَيَّرْنَا بِكُمْ ۖ لَئِن لَّمْ تَنتَهُوا۟ لَنَرْجُمَنَّكُمْ وَلَيَمَسَّنَّكُم مِّنَّا عَذَابٌ أَلِيمٌۭ ۝١٨ قَالُوا۟ طَـٰٓئِرُكُم مَّعَكُمْ ۚ أَئِن ذُكِّرْتُم ۚ بَلْ أَنتُمْ قَوْمٌۭ مُّسْرِفُونَ ۝١٩ وَجَآءَ مِنْ أَقْصَا ٱلْمَدِينَةِ رَجُلٌۭ يَسْعَىٰ قَالَ يَـٰقَوْمِ ٱتَّبِعُوا۟ ٱلْمُرْسَلِينَ ۝٢٠ ٱتَّبِعُوا۟ مَن لَّا يَسْـَٔلُكُمْ أَجْرًۭا وَهُم مُّهْتَدُونَ ۝٢١ وَمَا لِىَ لَآ أَعْبُدُ ٱلَّذِى فَطَرَنِى وَإِلَيْهِ تُرْجَعُونَ ۝٢٢ ءَأَتَّخِذُ مِن دُونِهِۦٓ ءَالِهَةً إِن يُرِدْنِ ٱلرَّحْمَـٰنُ بِضُرٍّۢ لَّا تُغْنِ عَنِّى شَفَـٰعَتُهُمْ شَيْـًۭٔا وَلَا يُنقِذُونِ ۝٢٣ إِنِّىٓ إِذًۭا لَّفِى ضَلَـٰلٍۢ مُّبِينٍ ۝٢٤ إِنِّىٓ ءَامَنتُ بِرَبِّكُمْ فَٱسْمَعُونِ ۝٢٥ قِيلَ ٱدْخُلِ ٱلْجَنَّةَ ۖ قَالَ يَـٰلَيْتَ قَوْمِى يَعْلَمُونَ ۝٢٦ بِمَا غَفَرَ لِى رَبِّى وَجَعَلَنِى مِنَ ٱلْمُكْرَمِينَ ۝٢٧ وَمَآ أَنزَلْنَا عَلَىٰ قَوْمِهِۦ مِنۢ بَعْدِهِۦ مِن جُندٍۢ مِّنَ ٱلسَّمَآءِ وَمَا كُنَّا مُنزِلِينَ ۝٢٨ إِن كَانَتْ إِلَّا صَيْحَةًۭ وَٰحِدَةًۭ فَإِذَا هُمْ خَـٰمِدُونَ ۝٢٩ يَـٰحَسْرَةً عَلَى ٱلْعِبَادِ ۚ مَا يَأْتِيهِم مِّن رَّسُولٍ إِلَّا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ ۝٣٠ أَلَمْ يَرَوْا۟ كَمْ أَهْلَكْنَا قَبْلَهُم مِّنَ ٱلْقُرُونِ أَنَّهُمْ إِلَيْهِمْ لَا يَرْجِعُونَ ۝٣١ وَإِن كُلٌّۭ لَّمَّا جَمِيعٌۭ لَّدَيْنَا مُحْضَرُونَ ۝٣٢ وَءَايَةٌۭ لَّهُمُ ٱلْأَرْضُ ٱلْمَيْتَةُ أَحْيَيْنَـٰهَا وَأَخْرَجْنَا مِنْهَا حَبًّۭا فَمِنْهُ يَأْكُلُونَ ۝٣٣ وَجَعَلْنَا فِيهَا جَنَّـٰتٍۢ مِّن نَّخِيلٍۢ وَأَعْنَـٰبٍۢ وَفَجَّرْنَا فِيهَا مِنَ ٱلْعُيُونِ ۝٣٤ لِيَأْكُلُوا۟ مِن ثَمَرِهِۦ وَمَا عَمِلَتْهُ أَيْدِيهِمْ ۖ أَفَلَا يَشْكُرُونَ ۝٣٥ سُبْحَـٰنَ ٱلَّذِى خَلَقَ ٱلْأَزْوَٰجَ كُلَّهَا مِمَّا تُنۢبِتُ ٱلْأَرْضُ وَمِنْ أَنفُسِهِمْ وَمِمَّا لَا يَعْلَمُونَ ۝٣٦ وَءَايَةٌۭ لَّهُمُ ٱلَّيْلُ نَسْلَخُ مِنْهُ ٱلنَّهَارَ فَإِذَا هُم مُّظْلِمُونَ ۝٣٧ وَٱلشَّمْسُ تَجْرِى لِمُسْتَقَرٍّۢ لَّهَا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ ۝٣٨ وَٱلْقَمَرَ قَدَّرْنَـٰهُ مَنَازِلَ حَتَّىٰ عَادَ كَٱلْعُرْجُونِ ٱلْقَدِيمِ ۝٣٩ لَا ٱلشَّمْسُ يَنۢبَغِى لَهَآ أَن تُدْرِكَ ٱلْقَمَرَ وَلَا ٱلَّيْلُ سَابِقُ ٱلنَّهَارِ ۚ وَكُلٌّۭ فِى فَلَكٍۢ يَسْبَحُونَ ۝٤٠ وَءَايَةٌۭ لَّهُمْ أَنَّا حَمَلْنَا ذُرِّيَّتَهُمْ فِى ٱلْفُلْكِ ٱلْمَشْحُونِ ۝٤١ وَخَلَقْنَا لَهُم مِّن مِّثْلِهِۦ مَا يَرْكَبُونَ ۝٤٢ وَإِن نَّشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنقَذُونَ ۝٤٣ إِلَّا رَحْمَةًۭ مِّنَّا وَمَتَـٰعًا إِلَىٰ حِينٍۢ ۝٤٤ وَإِذَا قِيلَ لَهُمُ ٱتَّقُوا۟ مَا بَيْنَ أَيْدِيكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُونَ ۝٤٥ وَمَا تَأْتِيهِم مِّنْ ءَايَةٍۢ مِّنْ ءَايَـٰتِ رَبِّهِمْ إِلَّا كَانُوا۟ عَنْهَا مُعْرِضِينَ ۝٤٦ وَإِذَا قِيلَ لَهُمْ أَنفِقُوا۟ مِمَّا رَزَقَكُمُ ٱللَّهُ قَالَ ٱلَّذِينَ كَفَرُوا۟ لِلَّذِينَ ءَامَنُوٓا۟ أَنُطْعِمُ مَن لَّوْ يَشَآءُ ٱللَّهُ أَطْعَمَهُۥٓ إِنْ أَنتُمْ إِلَّا فِى ضَلَـٰلٍۢ مُّبِينٍۢ ۝٤٧ وَيَقُولُونَ مَتَىٰ هَـٰذَا ٱلْوَعْدُ إِن كُنتُمْ صَـٰدِقِينَ ۝٤٨ مَا يَنظُرُونَ إِلَّا صَيْحَةًۭ وَٰحِدَةًۭ تَأْخُذُهُمْ وَهُمْ يَخِصِّمُونَ ۝٤٩ فَلَا يَسْتَطِيعُونَ تَوْصِيَةًۭ وَلَآ إِلَىٰٓ أَهْلِهِمْ يَرْجِعُونَ ۝٥٠ وَنُفِخَ فِى ٱلصُّورِ فَإِذَا هُم مِّنَ ٱلْأَجْدَاثِ إِلَىٰ رَبِّهِمْ يَنسِلُونَ ۝٥١ قَالُوا۟ يَـٰوَيْلَنَا مَنۢ بَعَثَنَا مِن مَّرْقَدِنَا ۜ ۗ هَـٰذَا مَا وَعَدَ ٱلرَّحْمَـٰنُ وَصَدَقَ ٱلْمُرْسَلُونَ ۝٥٢ إِن كَانَتْ إِلَّا صَيْحَةًۭ وَٰحِدَةًۭ فَإِذَا هُمْ جَمِيعٌۭ لَّدَيْنَا مُحْضَرُونَ ۝٥٣ فَٱلْيَوْمَ لَا تُظْلَمُ نَفْسٌۭ شَيْـًۭٔا وَلَا تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَ ۝٥٤ إِنَّ أَصْحَـٰبَ ٱلْجَنَّةِ ٱلْيَوْمَ فِى شُغُلٍۢ فَـٰكِهُونَ ۝٥٥ هُمْ وَأَزْوَٰجُهُمْ فِى ظِلَـٰلٍ عَلَى ٱلْأَرَآئِكِ مُتَّكِـُٔونَ ۝٥٦ لَهُمْ فِيهَا فَـٰكِهَةٌۭ وَلَهُم مَّا يَدَّعُونَ ۝٥٧`, t:1, note:``},
 {n:`سَلَـٰمٌۭ قَوْلًۭا مِّن رَّبٍّۢ رَّحِيمٍ ۝٥٨`, t:7, note:`تكررها  (سبعاً)`},
 {n:`وَٱمْتَـٰزُوا۟ ٱلْيَوْمَ أَيُّهَا ٱلْمُجْرِمُونَ ۝٥٩ أَلَمْ أَعْهَدْ إِلَيْكُمْ يَـٰبَنِىٓ ءَادَمَ أَن لَّا تَعْبُدُوا۟ ٱلشَّيْطَـٰنَ ۖ إِنَّهُۥ لَكُمْ عَدُوٌّۭ مُّبِينٌۭ ۝٦٠ وَأَنِ ٱعْبُدُونِى ۚ هَـٰذَا صِرَٰطٌۭ مُّسْتَقِيمٌۭ ۝٦١ وَلَقَدْ أَضَلَّ مِنكُمْ جِبِلًّۭا كَثِيرًا ۖ أَفَلَمْ تَكُونُوا۟ تَعْقِلُونَ ۝٦٢ هَـٰذِهِۦ جَهَنَّمُ ٱلَّتِى كُنتُمْ تُوعَدُونَ ۝٦٣ ٱصْلَوْهَا ٱلْيَوْمَ بِمَا كُنتُمْ تَكْفُرُونَ ۝٦٤ ٱلْيَوْمَ نَخْتِمُ عَلَىٰٓ أَفْوَٰهِهِمْ وَتُكَلِّمُنَآ أَيْدِيهِمْ وَتَشْهَدُ أَرْجُلُهُم بِمَا كَانُوا۟ يَكْسِبُونَ ۝٦٥ وَلَوْ نَشَآءُ لَطَمَسْنَا عَلَىٰٓ أَعْيُنِهِمْ فَٱسْتَبَقُوا۟ ٱلصِّرَٰطَ فَأَنَّىٰ يُبْصِرُونَ ۝٦٦ وَلَوْ نَشَآءُ لَمَسَخْنَـٰهُمْ عَلَىٰ مَكَانَتِهِمْ فَمَا ٱسْتَطَـٰعُوا۟ مُضِيًّۭا وَلَا يَرْجِعُونَ ۝٦٧ وَمَن نُّعَمِّرْهُ نُنَكِّسْهُ فِى ٱلْخَلْقِ ۖ أَفَلَا يَعْقِلُونَ ۝٦٨ وَمَا عَلَّمْنَـٰهُ ٱلشِّعْرَ وَمَا يَنۢبَغِى لَهُۥٓ ۚ إِنْ هُوَ إِلَّا ذِكْرٌۭ وَقُرْءَانٌۭ مُّبِينٌۭ ۝٦٩ لِّيُنذِرَ مَن كَانَ حَيًّۭا وَيَحِقَّ ٱلْقَوْلُ عَلَى ٱلْكَـٰفِرِينَ ۝٧٠ أَوَلَمْ يَرَوْا۟ أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَآ أَنْعَـٰمًۭا فَهُمْ لَهَا مَـٰلِكُونَ ۝٧١ وَذَلَّلْنَـٰهَا لَهُمْ فَمِنْهَا رَكُوبُهُمْ وَمِنْهَا يَأْكُلُونَ ۝٧٢ وَلَهُمْ فِيهَا مَنَـٰفِعُ وَمَشَارِبُ ۖ أَفَلَا يَشْكُرُونَ ۝٧٣ وَٱتَّخَذُوا۟ مِن دُونِ ٱللَّهِ ءَالِهَةًۭ لَّعَلَّهُمْ يُنصَرُونَ ۝٧٤ لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُندٌۭ مُّحْضَرُونَ ۝٧٥ فَلَا يَحْزُنكَ قَوْلُهُمْ ۘ إِنَّا نَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ ۝٧٦ أَوَلَمْ يَرَ ٱلْإِنسَـٰنُ أَنَّا خَلَقْنَـٰهُ مِن نُّطْفَةٍۢ فَإِذَا هُوَ خَصِيمٌۭ مُّبِينٌۭ ۝٧٧ وَضَرَبَ لَنَا مَثَلًۭا وَنَسِىَ خَلْقَهُۥ ۖ قَالَ مَن يُحْىِ ٱلْعِظَـٰمَ وَهِىَ رَمِيمٌۭ ۝٧٨ قُلْ يُحْيِيهَا ٱلَّذِىٓ أَنشَأَهَآ أَوَّلَ مَرَّةٍۢ ۖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ ۝٧٩ ٱلَّذِى جَعَلَ لَكُم مِّنَ ٱلشَّجَرِ ٱلْأَخْضَرِ نَارًۭا فَإِذَآ أَنتُم مِّنْهُ تُوقِدُونَ ۝٨٠ أَوَلَيْسَ ٱلَّذِى خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ بِقَـٰدِرٍ عَلَىٰٓ أَن يَخْلُقَ مِثْلَهُم ۚ`, t:1, note:``},

 {n:`اللَّهُمَّ صَلِّ عَلَى مَنْ مِنْهُ انْشَقَّتِ الأسْرَارُ، وَانْفَلَقَتِ الأنْوَارُ، وَفِيهِ ارْتَقَتِ الْحَقَائِقُ، وَتَنَزَّلَتْ عُلُومُ آدَمَ فَأعْجَزَ الْخَلاَئِقَ، وَلَهُ تَضَاءَلَتِ الْفُهُومُ فَلَمْ يُدْرِكْهُ مِنَّا سَابِقٌ وَلاَ لاَحِقٌ، فَرِيَاضُ الْمَلَكُوتِ بِزَهْرِ جَمَالِهِ مُونِقَةٌ، وَحِيَاضُ الْجَبَرُوتِ بِفَيْضِ أنْوَارِهِ مُتَدَفِّقَةٌ، وَلاَ شَيْءَ إِلاً وَهُوَ بِهِ مَنُوطٌ، إِذ لَوْلاَ الْوَاسِطَةُ لَذَهَبَ كَمَا قِيلَ الْمَوْسُوطُ، صَلاَةً تَلِيقُ بِكَ مِنْكَ إِلَيْهِ كَمَا هو أهْلُهُ.اللَّهُمَّ إِنَّهُ سِرُّكَ الْجَامِعُ الدَّالُّ عَلَيْكَ، وَحِجَابُكَ الأعْظَمُ الْقَائِمُ لَكَ بَيْنَ يَدَيْكَ. اللَّهُمَّ أَلْحِقْنِي بَنَسَبِهِ، وَحَقِّقْنِي بِحَسَبِهِ، وَعَرِّفْنِي إِيَّاهُ مَعْرِفَةً أَسْلَمُ بِهَا مِنْ مَوَارِدِ الْجَهْلِ، وَأَكْرَعُ بِهَا مِنْ مَوَارِدِ الْفَضْلِ، وَاحْمِلْنِي عَلَى سَبِيلِهِ إِلَى حَضْرَتِكَ حَمْلاً مَحْفُوفاً بِنَصْرَتِكَ، وَاقْذِفْ بِي عَلَى الْبَاطِلِ فَأَدْمَغَهُ، وَزُجَّ بِي فِي بِحَارِ الأَحَدِيَّةِ، وَانْشُلْنِي مِنْ أَوْحَالِ التَّوْحِيدِ، وَأَغْرِقْنِي فِي عَيْنِ بَحْرِ الْوَحْدَةِ، حَتَّى لاَ أَرَى وَلاَ أَسْمَعَ وَلاَ أَجِدَ وَلاَ أُحِسَّ إِلاَّ بِهَا.وَاجْعَلِ الْحِجَابَ الأَعْظَمَ حَيَاةَ رُوحِي، وَرُوحَهُ سِرَّ حَقِيقَتِي، وَحَقِيقَتَهُ جَامِعَ عَوَالِمِي، بِتَحْقِيقِ الْحَقِّ الأَوَّلِ، يَا أَوَّلُ يَا آخِرُ يَا ظَاهِرُ يَا بَاطِنُ، اسْمَعْ نِدَائِي بِمَا سَمِعْتَ بِهِ نِدَاءَ عَبْدِكَ زَكَرِيَّا، وَانْصُرْنِي بِكَ لَكَ، وَأَيِّدْنِي بِكَ لَكَ، وَاجْمَعْ بَيْنِي وَبَيْنَكَ، وَحُلْ بَيْنِي وَبَيْنَ غَيْرِكَ، اللهُ، اللهُ، اللهُ (إِنَّ الَّذِي فَرَضَ عَلَيْكَ الْقُرْآنَ لَرَادُّكَ إِلَى مَعَادٍ)، (رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَداً`, t:1, note:`ثُمَّ الصَّلَاةَ المشيشية`},
].map(s => ({ text:s.n, target:s.t, note:s.note || "", conditional: !!s.c }));

const MUNAJAH_STEPS = [
 {n:`بسم الله الرحمن الرحيم إِلَهِي اكْشِفْ لِي عَنْ عَالَمِ المُلْكِ وَالمَلَكُوتِ، وَافْتَحْ لِي مِنْ هَذِهِ السَّاعَةِ، كَشْفَ العَوَالِمِ إِلَى الجَبَرُوتِ، وَأَطْلِعْنِي عَلَى أَسْرَارِكَ المُودَعَةِ فِي كُلِّ العَوَالِمِ وَالنَّاسُوتِ. إِلَهِي بَلِّغْنِي مَعْرِفَةَ أَكْوَانِكَ وَأَسْرَارِهَا، وَبَحِّرْنِي فِي عُلُومِهَا وَأَنْوَارِهَا، وَبَرِّحْ عَنْ قَلْبِي حُجُبَهَا وَأَغْيَارَهَا. إِلَهِي تَوِّجْنِي بِتَاجِ المَهَابَةِ فِي جَمِيعِ الأَكْوَانِ، وَتَوَلَّنِي بِعِنَايَتِكَ الكُبْرَى فِي سَائِرِ الأَزْمَانِ، وَتَمِّمْ لِي مَقَاصِدِي يَا رَحِيمُ يَا رَحْمَنُ. إِلَهِي ثَبِّتْ بَصَرِي وَبَصِيرَتِي لِشُهُودِكَ، وَثَقِّلْ مِيزَانِي لِأَكُونَ مِنْ خَوَاصِّ جُنُودِكَ، وَثَبِّتْنِي فِي مَشَاهِيرِ الكِبْرِيَاءِ مَعَ الطَّالِبِينَ لِمَقْصُودِكَ. إِلَهِي جَمِّلْنِي فِي الدَّارَيْنِ بَيْنَ عِبَادِكَ، وَجَمِّلْ أَعْمَالِي بِمَحْضِ فَضْلِكَ وَوِدَادِكَ، وَجَلِّلْنِي فِي الأَكْوَانِ بِمَهَابَتِكَ وَإِسْعَادِكَ. إِلَهِي حَلِّنِي بِالتَّقْوَى فِي سَائِرِ الأَوْقَاتِ، وَحُفُّنِي بِعِنَايَتِكَ العُظْمَى فِي سَائِرِ السَّاعَاتِ، وَحَسِّنْ لِي أَحْوَالِي فِي الحَيَاةِ وَبَعْدَ المَمَاتِ. إِلَهِي خَمِّرْ فُؤَادِي بِمَحَبَّتِكَ السَّرْمَدِيَّةِ، وَخَلِّّ فُؤَادِي لِمَوَدَّتِكَ العَلِيَّةِ، وَخَلِّصْ سِرِّي لِمُعَامَلَتِكَ الأَبَدِيَّةِ. إِلَهِي دُلّْنِي عَلَى عِبَادِكَ الَّذِينَ يَدُلُّونَ عَلَيْكَ، وَدَلِّلْنِي فِي كُلِّ مَشْهَدٍ عَظِيمٍ لِأَنْقَادَ بِهِ إِلَيْكَ، وَأَدِمْ إِخْلَاصِي حَتَّى يَكُونَ عَمَلِي كُلُّهُ مَقْبُولاً لَدَيْكَ. إِلَهِي ذَرَّةً مِنْ مَحَبَّتِكَ الخَالِصَةِ أَذْقْنِي إِيَّاهَا، وَذُبَالَةَ قَلْبِي أَشْعِلْهَا بِإِمْدَادِهَا وَسَنَاهَا، وَذَرْنِي فِي بُحْبُوحَةِ مَحَبَّتِكَ مَعَ أَخْصَاهَا. إِلَهِي رَقِّنِي لِمُشَاهَدَةِ اللَّوْحِ وَالقَلَمِ، وَرَبِّنِي بِمِدَادِ النُّونِ وَاليُمْنِ يَا أَكْرَمُ، وَرَضِّنِي بِكَ لِكَيْ أَحُوزَ خَيْرَ مَغْنَمٍ، إِلَهِي زُجَّ بِي فِي بِحَارِ أَسْرَارِكَ اللَّاهُوتِيَّةِ، وَزَمْزَمْ قَلْبِي لِمُشَاهَدَةِ ذَاتِكَ العَلِيَّةِ، وَزَهِّدْنِي فِيمَا سِوَاكَ لِيَدُومَ شُرْبِي بِكَ بُكْرَةً وَعَشِيَّةً. إِلَهِي سَلِّمْنِي مِنْ آفَاتِ الأَغْيَارِ، وَسَاعِدْنِي بِكَشْفِهَا وَالإِعْرَاضِ عَنْهَا يَا سَتَّارُ، وَسَامِرْنِي فِي كُلِّ ذَرَّةٍ مِنْهَا حَتَّى لَا أَرَى غَيْرَكَ فِيهَا يَا غَفَّارُ. إِلَهِي شَرِّفْنِي بِشُرُوقِ نُورِ لَاهُوتِيَّتِكَ فِي نَاسُوتِي، وَشَمِّمْنِي ذَلِكَ حَتَّى لَا أَرَى وَلَا أَسْمَعَ إِلَّا بِكَ فِي رَغْبَتِي وَرَهْبُوتِي، وَاشْدُدْ قُوَّتِي بِذَلِكَ حَتَّى أَفُوزَ بِرَحَمُوتِي. إِلَهِي صَرِّفْنِي فِي عَالَمِ المُلْكِ وَالمَلَكُوتِ، وَصُبَّ عَلَيَّ أَنْوَارَ الرَّحَمُوتِ، وَصُمَّ عَلَى قَلْبِي عَنِ الِالْتِفَاتِ لِسِوَاكَ مِنَ العَرْشِ إِلَى البَهَمُوتِ. إِلَهِي ضُمَّنِي إِلَيْكَ ضَمَّ فَنَاءٍ وَبَقَاءٍ بِكَ، وَنَوِّرْ لِي بِنُورِكَ لِأَشْهَدَكَ فِي كُلِّ مُكَوِّنٍ بِقُدْرَتِكَ، وَضُمَّ فُؤَادِي إِلَيْكَ، وَارْوِهِ مِنْ صَافِي شُرْبِكَ. إِلَهِي طَهِّرْنِي مِنَ النَّقَائِصِ وَالعُيُوبِ، وَأَطْلِعْنِي إِلَى حُجُبِ السُّبُحَاتِ وَاكْشِفْ لِي الغُيُوبَ، وَطَوِّرْنِي فِي حَالَةٍ أَنَالُ بِهَا صُحْبَةَ الخَضِرِ وَصَاحِبِهِ المَحْبُوبِ. إِلَهِي أَظِلَّنِي تَحْتَ ظِلِّ عَرْشِكَ حِينَ يَحْمَى الرَّحَامُ، وَظَلِّلْ عَلَيَّ بِظِلِّ رَايَاتِكَ الفِخَامِ، وَضُمَّ فُؤَادِي إِلَيْكَ، وَارْوِهِ بِأَنْوَارِ الإِكْرَامِ. إِلَهِي عَلِّنِي لِأَعْلَى مَقَامَاتِ الوِلَايَةِ، وَعَمِّرْنِي فِي سَطْحِهَا فِي النِّهَايَةِ، وَعُمِّنِي بِفَضْلِكَ الَّذِي مَنَحْتَهُ الأَقْطَابَ وَالأَفْرَادَ أَهْلَ العِنَايَةِ. إِلَهِي غَيِّبْنِي فِي لُجَّةِ مُشَاهَدَةِ الذَّاتِ، وَغَمِّرْنِي بِهَا حَتَّى لَا أَجِدَ وَلَا أُحِسَّ إِلَّا بِتِلْكَ الهِبَاتِ، وَغُلَّنِي بِكَ لَكَ حَتَّى أَكُونَ عَزِيزاً فِي الحَضَرَاتِ. إِلَهِي فُكَّ لِي عَنْ كُلِّ سِرٍّ مُطَلْسَمٍ، وَفَرِّحْنِي بِالفَنَاءِ وَالبَقَاءِ فِي نَبِيِّكَ الأَعْظَمِ، وَفَرِّجْ عَنْ قَلْبِي وَسُوَيْدَايَ كُلَّ هَمٍّ وَغَمٍّ. إِلَهِي قِنِي شَرَّ أَعْدَائِي وَجَمِيعَ الأَسْوَاءِ، وَقَرِّبْنِي فِي مَشَاهِدِ القُرْبِ، وَنَجِّنِي مِنَ الأهْوَاءِ، وَقَلِّبْنِي فِي حَضَرَاتِكَ وَحَضَرَاتِ مُصْطَفَاكَ حَتَّى فِي المُشَاهَدَةِ أَقْوَى. إِلَهِي كَلِّمْنِي كُلَّ حِينٍ بِمُكَالَمَةِ الأَحْبَابِ، وَكَمِّلْنِي بِنَفَحَاتِكَ لِأَنَالَ مَنَازِلَ الأَقْطَابِ، وَكَرِّمْنِي فِي الدَّارَيْنِ بِكَرَامَةِ الأَغْوَاثِ وَالأَنْجَابِ. إِلَهِي لُمَّ شَمْلِي إِلَيْكَ لَمّاً أَكِيداً، وَلُفَّ سِرِّي عَلَى مُطَالَعَتِكَ لَفّاً مَجِيداً، وَلَحِّفْنِي بِرِدَاءِ صَوْنِكَ، خَلْفَ حِجَابِ عِزَّتِكَ الأَحْمَى لَحْفاً فَرِيداً. اللَّهُمَّ مَكِّنِي فِي أَعْلَى دَرَجَاتِ القُرْبَى بِلَا امْتِحَانٍ، وَمَوْتُ نَفْسِي حَتَّى أَفُوزَ بِالرِّضْوَانِ، وَامْلأْ قَلْبِي بِنُورِكَ وَاجْعَلْهُ بَيْتَ تَجَلِّيَكَ يَا مَنَّانُ. إِلَهِي نَفْحَةً مِنْ نَفَحَاتِكَ الَّتِي نَفَحْتَ بِهَا أَوْلِيَاءَكَ وَأَنْبِيَاءَكَ، وَنَسْمَةً مِنْ نَسَمَاتِكَ الَّتِي خَصَصْتَ بِهَا مُصْطَفَاكَ، وَنَيْلَةً مِنْ نَوَالِكَ الَّذِي وَهَبْتَهُ الزَّهْرَاءَ رُوحَ مُجْتَبَاكَ. إِلَهِي هَلْهِلْ عَلَيَّ مُزْنَ فَيْضِكَ الصَّمَدَانِي، وَهَمِّمْ سِرِّي لِإِدْرَاكِ وَبِلِكَ الفَرْدَانِي، وَهَيِّئْنِي لِخِلَافَتِكَ بِمَظْهَرِ نُورِكَ السُّبْحَانِي. إِلَهِي وَصِلْنِي لِأَعْلَى مَقَامَاتِ الوِلَايَةِ، وَوَلِّنِي الغَوْثِيَّةَ وَالرِّعَايَةَ، وَأَرِنِي كُلَّ سِرِّ كَوْنِي أَوْ إِلَهِي مَنَحْتَهُ أَهْلَ الغَايَةِ. إِلَهِي لَا تَرُدَّنِي فِيمَا سَأَلْتُكَ، وَلَا تُخَيِّبْ ظَنِّي فِيمَا طَلَبْتُكَ، وَلَا تَفْضَحْنِي فِي الدُّنْيَا وَلَا فِي الآخِرَةِ بَيْنَ خَلْقِكَ. إِلَهِي يَمِّمْ وَجْهِي وِجْهَتِي إِلَيْكَ، وَيَمِّنْ سِرِّي لِأَفُوزَ بِمَا لَدَيْكَ، وَيَمِّنْ بِرَّكَ وَمَحَبَّتِكَ امْنَحْنِيِهِ حَتَّى أَكُونَ كَرِيماً عَلَيْكَ. إِلَهِي صَلِّ وَسَلِّمْ عَلَى نَبِيِّكَ الَّذِي أَسْأَلُكَ بِهِ جَمِيعَ مَا سَأَلْتُ، وَأَطْلُبُ بِبَرَكَتِهِ إِدْرَاكَ مَا طَلَبْتُ، وَاتْبَعْ آلِهِ وَصَحْبِهِ، يَا مَنْ أَنْتَ أَنْتَ.`, t:1, note:`المناجاة: تُقرأ بعد الفراغ من الأذكار، وقت السحر`},
].map(s => ({ text:s.n, target:s.t, note:s.note || "" }));
